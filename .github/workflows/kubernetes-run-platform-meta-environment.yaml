        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-run-idm.outputs.check-run-id }}

      # === Prepare Deploy-Manifests ===
      - name: Start check - Prepare Deploy-Manifests
        id: check-run-idm-package-prepare
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Prepare Deploy-Manifests'
      - name: Prepare deploy-manifests for packaging
        id: run-idm-package-prepare
        uses: ./.github/buildon-github-actions/src/actions/kubernetes-run-image-deploy-manifests-package-prepare
        with:

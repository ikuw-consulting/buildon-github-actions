      - name: Pass check - Pre-package Prepare
        if: steps.kpm.outputs.HOOK_PRE_PACKAGE_PREPARE_SCRIPT_SUB_PATH != '' && success() && steps.check-pre-package-prepare.outputs.check-run-id != ''

          kubernetes-workload-termination-grace-period-seconds: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_TERMINATION_GRACE_PERIOD_SECONDS }}
          kubernetes-workload-prestop-command: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PRESTOP_COMMAND }}
          kubernetes-workload-affinity-strategy: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_AFFINITY_STRATEGY }}
          kubernetes-workload-probe-liveness-check-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_LIVENESS_CHECK_TYPE }}
          kubernetes-workload-probe-readiness-check-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_READINESS_CHECK_TYPE }}
          kubernetes-workload-probe-startup-check-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_STARTUP_CHECK_TYPE }}
          kubernetes-workload-probe-liveness-http-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_LIVENESS_HTTP_PATH }}
          kubernetes-workload-probe-readiness-http-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_READINESS_HTTP_PATH }}
          kubernetes-workload-probe-startup-http-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_STARTUP_HTTP_PATH }}
          kubernetes-workload-replicas: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_REPLICAS }}
          kubernetes-workload-revision-history-limit: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_REVISION_HISTORY_LIMIT }}
          # Kubernetes Service generation
          kubernetes-service-generation-enabled: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_GENERATION_ENABLED }}
          kubernetes-service-type: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_TYPE }}
          kubernetes-service-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PORT }}
          kubernetes-service-target-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_TARGET_PORT }}
          kubernetes-service-protocol: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PROTOCOL }}
          kubernetes-service-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_NAME_SUFFIX }}
          kubernetes-service-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_COMBINED_SUB_PATH }}
          kubernetes-service-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_ADDITIONAL_LABELS }}
          kubernetes-service-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_ADDITIONAL_ANNOTATIONS }}

          # Token substitution
          token-delimiter-style: ${{ steps.kpm.outputs.TOKEN_DELIMITER_STYLE }}
          token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
          token-name-validation: ${{ steps.kpm.outputs.TOKEN_NAME_VALIDATION }}
          token-builtin-mode: ${{ steps.kpm.outputs.TOKEN_BUILTIN_MODE }}
          config-sub-path: ${{ steps.kpm.outputs.CONFIG_SUB_PATH }}
          config-value-trailing-newline: ${{ steps.kpm.outputs.CONFIG_VALUE_TRAILING_NEWLINE }}
          token-substitution-passes: ${{ steps.kpm.outputs.TOKEN_SUBSTITUTION_PASSES }}

          # Naming, Versions, and Tags calculation
          release-branch: ${{ steps.kpm.outputs.RELEASE_BRANCH }}
          additional-release-branches: ${{ steps.kpm.outputs.ADDITIONAL_RELEASE_BRANCHES }}
          tag-version-max-parts: ${{ steps.kpm.outputs.TAG_VERSION_MAX_PARTS }}
          tag-version-calculation-strategy: ${{ steps.kpm.outputs.TAG_VERSION_CALCULATION_STRATEGY }}
          tag-version-pattern-type: ${{ steps.kpm.outputs.TAG_VERSION_PATTERN_TYPE }}
          tag-version-prefix-parts: ${{ steps.kpm.outputs.TAG_VERSION_PREFIX_PARTS }}
          tag-version-source-sub-path: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_SUB_PATH }}
          tag-version-source-file-name: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_FILE_NAME }}
          tag-version-source-custom-pattern: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_CUSTOM_PATTERN }}
          tag-version-source-two-sub-path: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_SUB_PATH }}
          tag-version-source-two-file-name: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_FILE_NAME }}
          tag-version-source-two-pattern: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_PATTERN }}
          tag-version-source-two-prefix-parts: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_PREFIX_PARTS }}

          # Quality check options
          block-slashes: ${{ steps.kpm.outputs.BLOCK_SLASHES }}
          qc-block-slash-containing-branches: ${{ steps.kpm.outputs.QC_BLOCK_SLASH_CONTAINING_BRANCHES }}
          qc-block-double-hyphen-containing-branches: ${{ steps.kpm.outputs.QC_BLOCK_DOUBLE_HYPHEN_CONTAINING_BRANCHES }}
          qc-require-conventional-branches: ${{ steps.kpm.outputs.QC_REQUIRE_CONVENTIONAL_BRANCHES }}
          qc-require-conventional-commits: ${{ steps.kpm.outputs.QC_REQUIRE_CONVENTIONAL_COMMITS }}
          qc-block-conventional-commits: ${{ steps.kpm.outputs.QC_BLOCK_CONVENTIONAL_COMMITS }}

          # Hook script paths
          hook-pre-build-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_BUILD_SCRIPT_SUB_PATH }}
          hook-pre-tagging-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_TAGGING_TESTS_SCRIPT_SUB_PATH }}
          hook-pre-docker-prepare-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_DOCKER_PREPARE_SCRIPT_SUB_PATH }}
          hook-post-docker-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_DOCKER_TESTS_SCRIPT_SUB_PATH }}
          hook-pre-package-prepare-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_PACKAGE_PREPARE_SCRIPT_SUB_PATH }}
          hook-post-package-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_PACKAGE_TESTS_SCRIPT_SUB_PATH }}
          hook-post-versions-and-naming-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_VERSIONS_AND_NAMING_SCRIPT_SUB_PATH }}
          hook-post-build-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH }}

          # GitHub release
          github-release-enabled: ${{ steps.kpm.outputs.GITHUB_RELEASE_ENABLED }}
          github-release-substituted-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_SUBSTITUTED_FILES }}
          github-release-verbatim-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_VERBATIM_FILES }}
          github-release-notes: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES }}
          github-release-notes-file: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES_FILE }}
          github-release-add-version-to-filenames: ${{ steps.kpm.outputs.GITHUB_RELEASE_ADD_VERSION_TO_FILENAMES }}

          # === Step Outputs ===
          # Version outputs (from versions-and-naming)
          version: ${{ steps.versions.outputs.version }}
          version-major: ${{ steps.versions.outputs.version-major }}
          version-minor: ${{ steps.versions.outputs.version-minor }}
          version-patch: ${{ steps.versions.outputs.version-patch }}
          version-2-part: ${{ steps.versions.outputs.version-2-part }}
          version-3-part: ${{ steps.versions.outputs.version-3-part }}
          version-4-part: ${{ steps.versions.outputs.version-4-part }}
          version-dns-safe: ${{ steps.versions.outputs.version-dns-safe }}
          version-2-part-dns-safe: ${{ steps.versions.outputs.version-2-part-dns-safe }}
          version-3-part-dns-safe: ${{ steps.versions.outputs.version-3-part-dns-safe }}
          version-4-part-dns-safe: ${{ steps.versions.outputs.version-4-part-dns-safe }}
          docker-tag: ${{ steps.versions.outputs.docker-tag }}
          docker-image-name: ${{ steps.versions.outputs.docker-image-name }}
          git-tag: ${{ steps.versions.outputs.git-tag }}
          project-name: ${{ steps.versions.outputs.project-name }}
          is-release: ${{ steps.versions.outputs.is-release }}
          # Docker outputs (from docker-build - empty in manifests-only workflows)
          docker-target-image-full-uri: ${{ steps.docker-build.outputs.docker-target-image-full-uri }}
          # Manifest outputs (from manifest-package)
          manifests-zip-file-name: ${{ steps.manifest-package.outputs.manifests-zip-file-name }}
          # Manifest repo provider outputs (from manifest-repo-provider-package)
          manifests-uri: ${{ steps.manifest-repo-provider-package.outputs.manifests-uri }}
      - name: Pass check - Post-package Tests
        if: steps.kpm.outputs.HOOK_POST_PACKAGE_TESTS_SCRIPT_SUB_PATH != '' && success() && steps.check-post-package.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-post-package.outputs.check-run-id }}
      - name: Fail check - Post-package Tests
        if: steps.kpm.outputs.HOOK_POST_PACKAGE_TESTS_SCRIPT_SUB_PATH != '' && failure() && steps.check-post-package.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-post-package.outputs.check-run-id }}

      # === Docker Multi-Tag ===
      - name: Start check - Docker Multi-Tag
        if: steps.kpm.outputs.DOCKER_PUSH_TARGETS != '' && success()
        id: check-docker-multi-tag
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Docker Multi-Tag'
      - name: Tag images for additional registries
        id: docker-multi-tag
        if: steps.kpm.outputs.DOCKER_PUSH_TARGETS != '' && success()
        uses: ./.github/buildon-github-actions/src/actions/docker-multi-tag
        with:
          docker-push-image-list-file: ${{ steps.docker-registry-logins.outputs.docker-push-image-list-file }}
          docker-push-targets: ${{ steps.kpm.outputs.DOCKER_PUSH_TARGETS }}
          docker-target-registry: ${{ steps.kpm.outputs.DOCKER_TARGET_REGISTRY }}
          docker-target-namespace: ${{ steps.kpm.outputs.DOCKER_TARGET_NAMESPACE }}
          image-build-command: ${{ steps.validate-tooling.outputs.IMAGE_BUILD_COMMAND }}
      - name: Pass check - Docker Multi-Tag
        if: steps.kpm.outputs.DOCKER_PUSH_TARGETS != '' && success() && steps.check-docker-multi-tag.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-docker-multi-tag.outputs.check-run-id }}
      - name: Fail check - Docker Multi-Tag
        if: steps.kpm.outputs.DOCKER_PUSH_TARGETS != '' && failure() && steps.check-docker-multi-tag.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-docker-multi-tag.outputs.check-run-id }}

      # === GitHub Release Prepare ===
      - name: Start check - GitHub Release Prepare
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && success()
        id: check-github-release-prepare
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → GitHub Release Prepare'
      - name: Resolve internal release files
        id: resolve-internal-release-files
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && success()
        shell: bash
        run: |
          echo "verbatim-files=" >> "${GITHUB_OUTPUT}"
          echo "substituted-files=" >> "${GITHUB_OUTPUT}"
          echo "raw-files=" >> "${GITHUB_OUTPUT}"

      - name: Prepare release files
        id: github-release-prepare
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && success()
        uses: ./.github/buildon-github-actions/src/actions/github-release-prepare
        with:
          github-release-substituted-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_SUBSTITUTED_FILES }}
          github-release-verbatim-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_VERBATIM_FILES }}
          github-release-raw-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_RAW_FILES }}
          internal-verbatim-files: >-
            ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}/release-change-data/release-change-data.yaml,
            ${{ steps.resolve-internal-release-files.outputs.verbatim-files }}
          internal-substituted-files: ${{ steps.resolve-internal-release-files.outputs.substituted-files }}
          internal-raw-files: >-
            ${{ steps.run-package.outputs.run-contents-zip-file }},
            ${{ steps.run-package.outputs.run-consumption-report-zip-file }},
            ${{ steps.run-idm-package.outputs.manifests-zip-sub-path }}/${{ steps.run-idm-package.outputs.manifests-zip-file-name }},
            ${{ steps.run-idm-contract-generate.outputs.contract-zip-sub-path }}/${{ steps.run-idm-contract-generate.outputs.contract-zip-file-name }},
            ${{ steps.resolve-internal-release-files.outputs.raw-files }}
          output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
          version: ${{ steps.versions.outputs.version }}
          version-major: ${{ steps.versions.outputs.version-major }}
          version-minor: ${{ steps.versions.outputs.version-minor }}
          version-patch: ${{ steps.versions.outputs.version-patch }}
          version-2-part: ${{ steps.versions.outputs.version-2-part }}
          version-3-part: ${{ steps.versions.outputs.version-3-part }}
          version-4-part: ${{ steps.versions.outputs.version-4-part }}
          version-dns-safe: ${{ steps.versions.outputs.version-dns-safe }}
          version-2-part-dns-safe: ${{ steps.versions.outputs.version-2-part-dns-safe }}
          version-3-part-dns-safe: ${{ steps.versions.outputs.version-3-part-dns-safe }}
          version-4-part-dns-safe: ${{ steps.versions.outputs.version-4-part-dns-safe }}
          git-tag: ${{ steps.versions.outputs.git-tag }}
          project-name: ${{ steps.versions.outputs.project-name }}
          docker-tag: ${{ steps.versions.outputs.docker-tag }}
          docker-image-name: ${{ steps.versions.outputs.docker-image-name }}
          is-release: ${{ steps.versions.outputs.is-release }}
          github-release-add-version-to-filenames: ${{ steps.kpm.outputs.GITHUB_RELEASE_ADD_VERSION_TO_FILENAMES }}
          token-delimiter-style: ${{ steps.kpm.outputs.TOKEN_DELIMITER_STYLE }}
          token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
          token-name-validation: ${{ steps.kpm.outputs.TOKEN_NAME_VALIDATION }}
          config-sub-path: ${{ steps.kpm.outputs.CONFIG_SUB_PATH }}
          allow-builtin-token-override: ${{ steps.kpm.outputs.ALLOW_BUILTIN_TOKEN_OVERRIDE }}
          config-value-trailing-newline: ${{ steps.kpm.outputs.CONFIG_VALUE_TRAILING_NEWLINE }}
          token-substitution-passes: ${{ steps.kpm.outputs.TOKEN_SUBSTITUTION_PASSES }}
          docker-target-registry: ${{ steps.kpm.outputs.DOCKER_TARGET_REGISTRY }}
          docker-target-namespace: ${{ steps.kpm.outputs.DOCKER_TARGET_NAMESPACE }}
          manifests-zip-file-name: ${{ steps.run-idm-package.outputs.manifests-zip-file-name }}
      - name: Pass check - GitHub Release Prepare
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && success() && steps.check-github-release-prepare.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-github-release-prepare.outputs.check-run-id }}
      - name: Fail check - GitHub Release Prepare
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && failure() && steps.check-github-release-prepare.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-github-release-prepare.outputs.check-run-id }}

      # === Git Tag Push ===
      - name: Start check - Git Tag Push
        if: steps.versions.outputs.is-release == 'true' && success()
        id: check-git-push-tag
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Git Tag Push'
      - name: Push git tag
        if: steps.versions.outputs.is-release == 'true' && success()
        uses: ./.github/buildon-github-actions/src/actions/git-push-tag
        with:
          git-tag: ${{ steps.versions.outputs.git-tag }}
          is-release: ${{ steps.versions.outputs.is-release }}
      - name: Pass check - Git Tag Push
        if: steps.versions.outputs.is-release == 'true' && success() && steps.check-git-push-tag.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-git-push-tag.outputs.check-run-id }}
      - name: Fail check - Git Tag Push
        if: steps.versions.outputs.is-release == 'true' && failure() && steps.check-git-push-tag.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-git-push-tag.outputs.check-run-id }}

      # === Manifest Repo Provider Publish ===
      - name: Start check - Publish Deploy-Manifests via Repo Provider
        if: steps.versions.outputs.is-release == 'true' && success()
        id: check-manifest-repo-provider-publish
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Publish Deploy-Manifests via Repo Provider'
      - name: Publish manifests via repo provider
        id: manifest-repo-provider-publish
        if: steps.versions.outputs.is-release == 'true' && success()
        uses: ./.github/buildon-github-actions/src/actions/kubernetes-manifests-repo-provider-publish
        with:
          manifests-repo-provider-type: ${{ steps.kpm.outputs.MANIFESTS_REPO_PROVIDER_TYPE }}
          manifests-uri: ${{ steps.manifest-repo-provider-package.outputs.manifests-uri }}
          manifests-zip-sub-path: ${{ steps.manifest-repo-provider-package.outputs.manifests-zip-sub-path }}
          manifests-zip-file-name: ${{ steps.manifest-repo-provider-package.outputs.manifests-zip-file-name }}
          version: ${{ steps.manifest-repo-provider-package.outputs.version }}
          is-release: ${{ steps.versions.outputs.is-release }}
          repo-provider-url: ${{ steps.manifest-repo-provider-package.outputs.repo-provider-url }}
          repo-provider-namespace: ${{ steps.manifest-repo-provider-package.outputs.repo-provider-namespace }}
          repo-provider-name: ${{ steps.manifest-repo-provider-package.outputs.repo-provider-name }}
          repo-provider-version: ${{ steps.manifest-repo-provider-package.outputs.repo-provider-version }}
      - name: Pass check - Publish Deploy-Manifests via Repo Provider
        if: steps.versions.outputs.is-release == 'true' && success() && steps.check-manifest-repo-provider-publish.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-manifest-repo-provider-publish.outputs.check-run-id }}
      - name: Fail check - Publish Deploy-Manifests via Repo Provider
        if: steps.versions.outputs.is-release == 'true' && failure() && steps.check-manifest-repo-provider-publish.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-manifest-repo-provider-publish.outputs.check-run-id }}

      # === Docker Push All ===
      - name: Start check - Docker Push All
        if: steps.versions.outputs.is-release == 'true' && success()
        id: check-docker-push-all
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Docker Push All'
      - name: Push all images
        id: docker-push-all
        if: steps.versions.outputs.is-release == 'true' && success()
        uses: ./.github/buildon-github-actions/src/actions/docker-push-all
        with:
          docker-push-image-list-file: ${{ steps.docker-registry-logins.outputs.docker-push-image-list-file }}
          is-release: ${{ steps.versions.outputs.is-release }}
          image-build-command: ${{ steps.validate-tooling.outputs.IMAGE_BUILD_COMMAND }}
          docker-platform: ${{ steps.kpm.outputs.DOCKER_PLATFORM }}
      - name: Pass check - Docker Push All
        if: steps.versions.outputs.is-release == 'true' && success() && steps.check-docker-push-all.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-docker-push-all.outputs.check-run-id }}
      - name: Fail check - Docker Push All
        if: steps.versions.outputs.is-release == 'true' && failure() && steps.check-docker-push-all.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-docker-push-all.outputs.check-run-id }}

      # === GitHub Release ===
      - name: Start check - GitHub Release
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && steps.versions.outputs.is-release == 'true' && success()
        id: check-github-release
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → GitHub Release'
      - name: Compute release notes
        id: release-notes
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && steps.versions.outputs.is-release == 'true' && success()
        shell: bash
        env:
          BUILD_MODE: build_server
          BUILD_PLATFORM: github-actions
          BUILD_PLATFORM_LOG_PROVIDER: github-actions
          USER_NOTES: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES }}
          USER_NOTES_FILE: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES_FILE }}
          VERSION: ${{ steps.versions.outputs.version }}
          PROJECT_NAME: ${{ steps.versions.outputs.project-name }}
          RUN_DEPLOY_IMAGE_URI: ${{ steps.run-package.outputs.run-deploy-image-uri }}
          RUN_ARTIFACTS_IMAGE_URI: ${{ steps.run-package.outputs.run-artifacts-image-uri }}
          RUN_CONTENTS_ZIP_FILE: ${{ steps.run-package.outputs.run-contents-zip-file }}
          RUN_CONSUMPTION_REPORT_ZIP_FILE: ${{ steps.run-package.outputs.run-consumption-report-zip-file }}
          MANIFESTS_URI: ${{ steps.manifest-repo-provider-publish.outputs.manifests-uri }}
          MANIFESTS_ZIP_FILE_NAME: ${{ steps.run-idm-package.outputs.manifests-zip-file-name }}
          CONTRACT_ZIP_FILE_NAME: ${{ steps.run-idm-contract-generate.outputs.contract-zip-file-name }}
          RELEASE_CHANGE_DATA_URI: ${{ steps.release-change-data-oci-package.outputs.release-change-data-image-uri }}
          OUTPUT_SUB_PATH: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
          ENV_WORKLOAD_CONTENTS_FILE: ${{ steps.run-aggregate.outputs.environment-workload-contents-file }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          display_name=$(./.github/buildon-github-actions/src/scripts/util/format-project-title "${PROJECT_NAME}")
          echo "title=${VERSION} — ${display_name}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${USER_NOTES_FILE}" ]]; then
            # Notes come from file, skip inline notes computation
            echo "notes=" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${USER_NOTES}" ]]; then
            # User provided notes override entirely
            {
              echo "notes<<NOTES_EOF"
              echo "${USER_NOTES}"
              echo "NOTES_EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            # Default run release format
            release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
            contents_zip_name=$(basename "${RUN_CONTENTS_ZIP_FILE}")
            report_zip_name=$(basename "${RUN_CONSUMPTION_REPORT_ZIP_FILE}")
            {
              echo "notes<<NOTES_EOF"
              echo "Automatic Kaptain run release for version ${VERSION} of ${PROJECT_NAME}. This release has the environment contents zip and consumption-report zip attached, alongside the deploy image (the applyable set baked at /kd/manifests with its env-var contract) and the deploy-manifests set for the consuming parent or bootstrap."
              echo ""
              echo "### Contents"
              if [[ -s "${ENV_WORKLOAD_CONTENTS_FILE}" ]]; then
                cat "${ENV_WORKLOAD_CONTENTS_FILE}"
              else
                echo "_(none)_"
              fi
              echo ""
              echo "### Release Assets"
              echo "* Environment Contents: [${contents_zip_name}](${release_url}/${contents_zip_name})"
              echo "* Consumption Report: [${report_zip_name}](${release_url}/${report_zip_name})"
              echo "* Deploy Manifests: [${MANIFESTS_ZIP_FILE_NAME}](${release_url}/${MANIFESTS_ZIP_FILE_NAME})"
              echo "* Deploy Manifests Contract: [${CONTRACT_ZIP_FILE_NAME}](${release_url}/${CONTRACT_ZIP_FILE_NAME})"
              echo "* Deploy Manifests Image: [${MANIFESTS_URI}](https://${MANIFESTS_URI})"
              echo "* Deploy Image: [${RUN_DEPLOY_IMAGE_URI}](https://${RUN_DEPLOY_IMAGE_URI})"
              echo "* Artifacts Image: [${RUN_ARTIFACTS_IMAGE_URI}](https://${RUN_ARTIFACTS_IMAGE_URI})"
              echo "* Release Change Data: [release-change-data-${VERSION}.yaml](${release_url}/release-change-data-${VERSION}.yaml)"
              echo "* Release Change Data Image: [${RELEASE_CHANGE_DATA_URI}](https://${RELEASE_CHANGE_DATA_URI})"
              ./.github/buildon-github-actions/src/scripts/util/format-release-image-list "${OUTPUT_SUB_PATH}" "${VERSION}"
              echo "NOTES_EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: GitHub Release
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && steps.versions.outputs.is-release == 'true' && success()
        uses: ./.github/buildon-github-actions/src/actions/github-release
        with:
          github-release-enabled: ${{ steps.kpm.outputs.GITHUB_RELEASE_ENABLED }}
          output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
          github-release-tag: ${{ steps.versions.outputs.version }}
          github-release-notes: ${{ steps.release-notes.outputs.notes }}
          github-release-notes-file: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES_FILE }}
          github-release-title: ${{ steps.release-notes.outputs.title }}
      - name: Pass check - GitHub Release
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && steps.versions.outputs.is-release == 'true' && success() && steps.check-github-release.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-github-release.outputs.check-run-id }}
      - name: Fail check - GitHub Release
        if: steps.kpm.outputs.GITHUB_RELEASE_ENABLED == 'true' && steps.versions.outputs.is-release == 'true' && failure() && steps.check-github-release.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-github-release.outputs.check-run-id }}

      # === Post-Build ===
      - name: Start check - Post-Build
        if: steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH != '' && success()
        id: check-post-build
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Post-Build'
      - name: Run post-build
        if: steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH != '' && success()
        id: post-build
        uses: ./.github/buildon-github-actions/src/actions/hook-post-build
        with:
          build-kind: kubernetes-run-platform-meta-environment
          image-build-command: ${{ steps.validate-tooling.outputs.IMAGE_BUILD_COMMAND }}
          schema-validation-command: ${{ steps.validate-tooling.outputs.SCHEMA_VALIDATION_COMMAND }}
          build-scripts-repo-root: ${{ steps.kpm.outputs.BUILD_SCRIPTS_REPO_ROOT }}
          docker-platform: ${{ steps.kpm.outputs.DOCKER_PLATFORM }}
          # === Workflow Inputs ===
          # Build output
          output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
          docker-push-image-list-file: ${{ steps.docker-registry-logins.outputs.docker-push-image-list-file }}

          # Docker registry logins
          docker-registry-logins: ${{ steps.kpm.outputs.DOCKER_REGISTRY_LOGINS }}
          # Docker build options
          dockerfile-sub-path: ${{ steps.kpm.outputs.DOCKERFILE_SUB_PATH }}
          dockerfile-squash: ${{ steps.kpm.outputs.DOCKERFILE_SQUASH }}
          dockerfile-no-cache: ${{ steps.kpm.outputs.DOCKERFILE_NO_CACHE }}
          # Docker target config (from early resolver)
          docker-target-registry: ${{ steps.kpm.outputs.DOCKER_TARGET_REGISTRY }}
          docker-target-namespace: ${{ steps.kpm.outputs.DOCKER_TARGET_NAMESPACE }}
          # Docker push targets
          docker-push-targets: ${{ steps.kpm.outputs.DOCKER_PUSH_TARGETS }}

          # Manifests source
          manifests-sub-path: ${{ steps.kpm.outputs.MANIFESTS_SUB_PATH }}
          # Manifests packaging
          manifests-repo-provider-type: ${{ steps.kpm.outputs.MANIFESTS_REPO_PROVIDER_TYPE }}
          manifests-packaging-base-image: ${{ steps.kpm.outputs.MANIFESTS_PACKAGING_BASE_IMAGE }}

          # Kubernetes Generation
          kubernetes-global-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_GLOBAL_ADDITIONAL_LABELS }}
          kubernetes-global-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_GLOBAL_ADDITIONAL_ANNOTATIONS }}
          # Kubernetes ConfigMap Generation
          kubernetes-configmap-sub-path: ${{ steps.kpm.outputs.KUBERNETES_CONFIGMAP_SUB_PATH }}
          kubernetes-configmap-name-checksum-injection: ${{ steps.kpm.outputs.KUBERNETES_CONFIGMAP_NAME_CHECKSUM_INJECTION }}
          kubernetes-configmap-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_CONFIGMAP_ADDITIONAL_LABELS }}
          kubernetes-configmap-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_CONFIGMAP_ADDITIONAL_ANNOTATIONS }}
          # Kubernetes Secret template generation
          kubernetes-secret-template-sub-path: ${{ steps.kpm.outputs.KUBERNETES_SECRET_TEMPLATE_SUB_PATH }}
          kubernetes-secret-template-name-checksum-injection: ${{ steps.kpm.outputs.KUBERNETES_SECRET_TEMPLATE_NAME_CHECKSUM_INJECTION }}
          kubernetes-secret-template-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_SECRET_TEMPLATE_ADDITIONAL_LABELS }}
          kubernetes-secret-template-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_SECRET_TEMPLATE_ADDITIONAL_ANNOTATIONS }}
          # Kubernetes ServiceAccount generation
          kubernetes-serviceaccount-generation-enabled: ${{ steps.kpm.outputs.KUBERNETES_SERVICEACCOUNT_GENERATION_ENABLED }}
          kubernetes-serviceaccount-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_SERVICEACCOUNT_NAME_SUFFIX }}
          kubernetes-serviceaccount-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_SERVICEACCOUNT_COMBINED_SUB_PATH }}
          kubernetes-serviceaccount-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_SERVICEACCOUNT_ADDITIONAL_LABELS }}
          kubernetes-serviceaccount-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_SERVICEACCOUNT_ADDITIONAL_ANNOTATIONS }}
          # Kubernetes Workload generation
          kubernetes-workload-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_TYPE }}
          kubernetes-workload-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_NAME_SUFFIX }}
          kubernetes-workload-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_COMBINED_SUB_PATH }}
          kubernetes-workload-env-sub-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_ENV_SUB_PATH }}
          kubernetes-workload-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_ADDITIONAL_LABELS }}
          kubernetes-workload-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_ADDITIONAL_ANNOTATIONS }}
          kubernetes-workload-container-port: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_CONTAINER_PORT }}
          kubernetes-workload-image-reference-style: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_IMAGE_REFERENCE_STYLE }}
          kubernetes-workload-readonly-root-filesystem: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_READONLY_ROOT_FILESYSTEM }}
          kubernetes-workload-seccomp-profile: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_SECCOMP_PROFILE }}
          kubernetes-workload-automount-service-account-token: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_AUTOMOUNT_SERVICE_ACCOUNT_TOKEN }}
          kubernetes-workload-image-pull-secrets: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_IMAGE_PULL_SECRETS }}
          kubernetes-workload-resources-memory: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_RESOURCES_MEMORY }}
          kubernetes-workload-resources-cpu-request: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_RESOURCES_CPU_REQUEST }}
          kubernetes-workload-resources-cpu-limit: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_RESOURCES_CPU_LIMIT }}
          kubernetes-workload-configmap-mount-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_CONFIGMAP_MOUNT_PATH }}
          kubernetes-workload-secret-mount-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_SECRET_MOUNT_PATH }}
          kubernetes-workload-termination-grace-period-seconds: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_TERMINATION_GRACE_PERIOD_SECONDS }}
          kubernetes-workload-prestop-command: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PRESTOP_COMMAND }}
          kubernetes-workload-affinity-strategy: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_AFFINITY_STRATEGY }}
          kubernetes-workload-probe-liveness-check-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_LIVENESS_CHECK_TYPE }}
          kubernetes-workload-probe-readiness-check-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_READINESS_CHECK_TYPE }}
          kubernetes-workload-probe-startup-check-type: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_STARTUP_CHECK_TYPE }}
          kubernetes-workload-probe-liveness-http-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_LIVENESS_HTTP_PATH }}
          kubernetes-workload-probe-readiness-http-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_READINESS_HTTP_PATH }}
          kubernetes-workload-probe-startup-http-path: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_PROBE_STARTUP_HTTP_PATH }}
          kubernetes-workload-replicas: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_REPLICAS }}
          kubernetes-workload-revision-history-limit: ${{ steps.kpm.outputs.KUBERNETES_WORKLOAD_REVISION_HISTORY_LIMIT }}
          # Kubernetes Service generation
          kubernetes-service-generation-enabled: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_GENERATION_ENABLED }}
          kubernetes-service-type: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_TYPE }}
          kubernetes-service-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PORT }}
          kubernetes-service-target-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_TARGET_PORT }}
          kubernetes-service-protocol: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PROTOCOL }}
          kubernetes-service-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_NAME_SUFFIX }}
          kubernetes-service-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_COMBINED_SUB_PATH }}
          kubernetes-service-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_ADDITIONAL_LABELS }}
          kubernetes-service-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_ADDITIONAL_ANNOTATIONS }}

          # Token substitution
          token-delimiter-style: ${{ steps.kpm.outputs.TOKEN_DELIMITER_STYLE }}
          token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
          token-name-validation: ${{ steps.kpm.outputs.TOKEN_NAME_VALIDATION }}
          token-builtin-mode: ${{ steps.kpm.outputs.TOKEN_BUILTIN_MODE }}
          config-sub-path: ${{ steps.kpm.outputs.CONFIG_SUB_PATH }}
          config-value-trailing-newline: ${{ steps.kpm.outputs.CONFIG_VALUE_TRAILING_NEWLINE }}
          token-substitution-passes: ${{ steps.kpm.outputs.TOKEN_SUBSTITUTION_PASSES }}

          # Naming, Versions, and Tags calculation
          release-branch: ${{ steps.kpm.outputs.RELEASE_BRANCH }}
          additional-release-branches: ${{ steps.kpm.outputs.ADDITIONAL_RELEASE_BRANCHES }}
          tag-version-max-parts: ${{ steps.kpm.outputs.TAG_VERSION_MAX_PARTS }}
          tag-version-calculation-strategy: ${{ steps.kpm.outputs.TAG_VERSION_CALCULATION_STRATEGY }}
          tag-version-pattern-type: ${{ steps.kpm.outputs.TAG_VERSION_PATTERN_TYPE }}
          tag-version-prefix-parts: ${{ steps.kpm.outputs.TAG_VERSION_PREFIX_PARTS }}
          tag-version-source-sub-path: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_SUB_PATH }}
          tag-version-source-file-name: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_FILE_NAME }}
          tag-version-source-custom-pattern: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_CUSTOM_PATTERN }}
          tag-version-source-two-sub-path: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_SUB_PATH }}
          tag-version-source-two-file-name: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_FILE_NAME }}
          tag-version-source-two-pattern: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_PATTERN }}
          tag-version-source-two-prefix-parts: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_PREFIX_PARTS }}

          # Quality check options
          block-slashes: ${{ steps.kpm.outputs.BLOCK_SLASHES }}
          qc-block-slash-containing-branches: ${{ steps.kpm.outputs.QC_BLOCK_SLASH_CONTAINING_BRANCHES }}
          qc-block-double-hyphen-containing-branches: ${{ steps.kpm.outputs.QC_BLOCK_DOUBLE_HYPHEN_CONTAINING_BRANCHES }}
          qc-require-conventional-branches: ${{ steps.kpm.outputs.QC_REQUIRE_CONVENTIONAL_BRANCHES }}
          qc-require-conventional-commits: ${{ steps.kpm.outputs.QC_REQUIRE_CONVENTIONAL_COMMITS }}
          qc-block-conventional-commits: ${{ steps.kpm.outputs.QC_BLOCK_CONVENTIONAL_COMMITS }}

          # Hook script paths
          hook-pre-build-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_BUILD_SCRIPT_SUB_PATH }}
          hook-pre-tagging-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_TAGGING_TESTS_SCRIPT_SUB_PATH }}
          hook-pre-docker-prepare-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_DOCKER_PREPARE_SCRIPT_SUB_PATH }}
          hook-post-docker-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_DOCKER_TESTS_SCRIPT_SUB_PATH }}
          hook-pre-package-prepare-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_PACKAGE_PREPARE_SCRIPT_SUB_PATH }}
          hook-post-package-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_PACKAGE_TESTS_SCRIPT_SUB_PATH }}
          hook-post-versions-and-naming-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_VERSIONS_AND_NAMING_SCRIPT_SUB_PATH }}
          hook-post-build-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH }}

          # GitHub release
          github-release-enabled: ${{ steps.kpm.outputs.GITHUB_RELEASE_ENABLED }}
          github-release-substituted-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_SUBSTITUTED_FILES }}
          github-release-verbatim-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_VERBATIM_FILES }}
          github-release-notes: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES }}
          github-release-notes-file: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES_FILE }}
          github-release-add-version-to-filenames: ${{ steps.kpm.outputs.GITHUB_RELEASE_ADD_VERSION_TO_FILENAMES }}

          # === Step Outputs ===
          # Version outputs (from versions-and-naming)
          version: ${{ steps.versions.outputs.version }}
          version-major: ${{ steps.versions.outputs.version-major }}
          version-minor: ${{ steps.versions.outputs.version-minor }}
          version-patch: ${{ steps.versions.outputs.version-patch }}
          version-2-part: ${{ steps.versions.outputs.version-2-part }}
          version-3-part: ${{ steps.versions.outputs.version-3-part }}
          version-4-part: ${{ steps.versions.outputs.version-4-part }}
          version-dns-safe: ${{ steps.versions.outputs.version-dns-safe }}
          version-2-part-dns-safe: ${{ steps.versions.outputs.version-2-part-dns-safe }}
          version-3-part-dns-safe: ${{ steps.versions.outputs.version-3-part-dns-safe }}
          version-4-part-dns-safe: ${{ steps.versions.outputs.version-4-part-dns-safe }}
          docker-tag: ${{ steps.versions.outputs.docker-tag }}
          docker-image-name: ${{ steps.versions.outputs.docker-image-name }}
          git-tag: ${{ steps.versions.outputs.git-tag }}
          project-name: ${{ steps.versions.outputs.project-name }}
          is-release: ${{ steps.versions.outputs.is-release }}
      - name: Pass check - Post-Build
        if: steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH != '' && success() && steps.check-post-build.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-post-build.outputs.check-run-id }}
      - name: Fail check - Post-Build
        if: steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH != '' && failure() && steps.check-post-build.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-post-build.outputs.check-run-id }}

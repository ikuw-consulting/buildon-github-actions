        with:
          action: pass
          check-run-id: ${{ steps.check-versions.outputs.check-run-id }}
      - name: Fail check - Versions & Naming
        if: failure() && steps.check-versions.outputs.check-run-id != ''
        uses: $/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-versions.outputs.check-run-id }}

      # === Post-Versions-and-Naming ===
      - name: Start check - Post-Versions-and-Naming
        if: steps.kpm.outputs.HOOK_POST_VERSIONS_AND_NAMING_SCRIPT_SUB_PATH != '' && success()
        id: check-post-versions-and-naming
        continue-on-error: true

          github-release-add-version-to-filenames: ${{ steps.kpm.outputs.GITHUB_RELEASE_ADD_VERSION_TO_FILENAMES }}
      - name: Pass check - Pre-tagging Tests
        if: steps.kpm.outputs.HOOK_PRE_TAGGING_TESTS_SCRIPT_SUB_PATH != '' && success() && steps.check-pre-tagging.outputs.check-run-id != ''
        continue-on-error: true
        uses: $/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-pre-tagging.outputs.check-run-id }}
      - name: Fail check - Pre-tagging Tests
        if: steps.kpm.outputs.HOOK_PRE_TAGGING_TESTS_SCRIPT_SUB_PATH != '' && failure() && steps.check-pre-tagging.outputs.check-run-id != ''
        uses: $/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-pre-tagging.outputs.check-run-id }}

      # === Versions & Naming ===
      - name: Start check - Versions & Naming
        id: check-versions
        continue-on-error: true
        uses: $/src/actions/github-check-run
        with:
          action: start
          check-name: 'Build & Publish → Versions & Naming'
      - name: Generate versions and naming
        id: versions
        uses: $/src/actions/versions-and-naming
        with:
          token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
          output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
          strip-repository-name-prefix: ${{ steps.kpm.outputs.STRIP_REPOSITORY_NAME_PREFIX }}

          docker-target-image-full-uri: ${{ steps.docker-build.outputs.docker-target-image-full-uri }}
      - name: Pass check - Pre-package Prepare
        if: steps.kpm.outputs.HOOK_PRE_PACKAGE_PREPARE_SCRIPT_SUB_PATH != '' && success() && steps.check-pre-package-prepare.outputs.check-run-id != ''
        continue-on-error: true
        uses: $/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-pre-package-prepare.outputs.check-run-id }}
      - name: Fail check - Pre-package Prepare
        if: steps.kpm.outputs.HOOK_PRE_PACKAGE_PREPARE_SCRIPT_SUB_PATH != '' && failure() && steps.check-pre-package-prepare.outputs.check-run-id != ''
        uses: $/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-pre-package-prepare.outputs.check-run-id }}

      # === Manifest Substitute ===
      - name: Start check - Substitute Manifests
        id: check-manifest-substitute
        continue-on-error: true

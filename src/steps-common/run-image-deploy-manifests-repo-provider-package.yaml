# id manifest-repo-provider-package on purpose: the shared
# manifest-repo-provider-publish block references that id, so the stock
# publish step works unchanged in the run workflows.
- name: Package deploy-manifests for repo provider
  id: manifest-repo-provider-package
  uses: ./.github/buildon-github-actions/src/actions/kubernetes-run-image-deploy-manifests-repo-provider-package
  with:
    project-name: ${{ steps.versions.outputs.project-name }}
    version: ${{ steps.versions.outputs.version }}
    manifests-zip-sub-path: ${{ steps.run-idm-package.outputs.manifests-zip-sub-path }}
    manifests-zip-file-name: ${{ steps.run-idm-package.outputs.manifests-zip-file-name }}
    contract-zip-sub-path: ${{ steps.run-idm-contract-generate.outputs.contract-zip-sub-path }}
    contract-zip-file-name: ${{ steps.run-idm-contract-generate.outputs.contract-zip-file-name }}
    # Env workflow only: this block is injected AFTER run-package there, so
    # the delegated zip exists. The run-platform workflow injects it in
    # deploy-manifests order where run-package has not run yet, which
    # empty - correct, since an RP never delegates upwards.
    cluster-scoped-on-behalf-zip-file: ${{ steps.run-package.outputs.run-cluster-scoped-on-behalf-zip-file }}
    docker-image-name: ${{ steps.versions.outputs.docker-image-name }}
    docker-tag: ${{ steps.versions.outputs.docker-tag }}
    docker-target-registry: ${{ steps.kpm.outputs.DOCKER_TARGET_REGISTRY }}
    docker-target-namespace: ${{ steps.kpm.outputs.DOCKER_TARGET_NAMESPACE }}
    docker-push-image-list-file: ${{ steps.docker-registry-logins.outputs.docker-push-image-list-file }}
    manifests-repo-provider-type: ${{ steps.kpm.outputs.MANIFESTS_REPO_PROVIDER_TYPE }}
    image-build-command: ${{ steps.validate-tooling.outputs.IMAGE_BUILD_COMMAND }}
    output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
    env-deploy-source-base-path: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_SOURCE_BASE_PATH }}

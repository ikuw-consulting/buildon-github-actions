- name: Stage deploy-image manifests
  id: run-image-deploy-manifests
  uses: ./.github/buildon-github-actions/src/actions/kubernetes-run-image-deploy-manifests
  with:
    project-name: ${{ steps.versions.outputs.project-name }}
    version: ${{ steps.versions.outputs.version }}
    output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
    token-delimiter-style: ${{ steps.kpm.outputs.TOKEN_DELIMITER_STYLE }}
    token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
    env-deploy-source-base-path: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_SOURCE_BASE_PATH }}
    generate-ideal-environment-deploy-manifests: ${{ steps.kpm.outputs.ENV_GENERATE_IDEAL_ENVIRONMENT_DEPLOY_MANIFESTS }}
    image-deploy-manifests-apply-mode: ${{ steps.kpm.outputs.ENV_IMAGE_DEPLOY_MANIFESTS_APPLY_MODE }}
    env-deploy-mode: ${{ steps.kpm.outputs.ENV_DEPLOY_MODE }}
    image-auto-update-provider: ${{ steps.kpm.outputs.ENV_IMAGE_AUTO_UPDATE_PROVIDER }}
    image-auto-update-policy: ${{ steps.kpm.outputs.ENV_IMAGE_AUTO_UPDATE_POLICY }}
    image-auto-update-trigger: ${{ steps.kpm.outputs.ENV_IMAGE_AUTO_UPDATE_TRIGGER }}
    image-auto-update-poll-schedule: ${{ steps.kpm.outputs.ENV_IMAGE_AUTO_UPDATE_POLL_SCHEDULE }}
    image-auto-update-field-manager-strategy: ${{ steps.kpm.outputs.ENV_IMAGE_AUTO_UPDATE_FIELD_MANAGER_STRATEGY }}
    cluster-scoped-delegation: ${{ steps.kpm.outputs.ENV_CLUSTER_SCOPED_DELEGATION }}

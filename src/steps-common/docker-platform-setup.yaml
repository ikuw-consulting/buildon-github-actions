- name: Docker platform setup
  if: steps.kpm.outputs.DOCKER_QEMU_SETUP_NEEDED == 'true'
  id: docker-platform-setup
  uses: $/src/actions/docker-platform-setup
  with:
    docker-platform: ${{ steps.kpm.outputs.DOCKER_PLATFORM }}
    image-build-command: ${{ steps.validate-tooling.outputs.IMAGE_BUILD_COMMAND }}

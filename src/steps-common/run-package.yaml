- name: Package run
  id: run-package
  uses: ./.github/buildon-github-actions/src/actions/kubernetes-run-package
  with:
    project-name: ${{ steps.versions.outputs.project-name }}
    version: ${{ steps.versions.outputs.version }}
    environment-workload-contents-sub-path: ${{ steps.run-substitute.outputs.environment-workload-contents-sub-path }}
    environment-workload-contents-config-sub-path: ${{ steps.run-substitute.outputs.environment-workload-contents-config-sub-path }}
    docker-image-name: ${{ steps.versions.outputs.docker-image-name }}
    docker-tag: ${{ steps.versions.outputs.docker-tag }}
    docker-platform: ${{ steps.kpm.outputs.DOCKER_PLATFORM }}
    docker-target-registry: ${{ steps.kpm.outputs.DOCKER_TARGET_REGISTRY }}
    docker-target-namespace: ${{ steps.kpm.outputs.DOCKER_TARGET_NAMESPACE }}
    docker-push-image-list-file: ${{ steps.docker-registry-logins.outputs.docker-push-image-list-file }}
    image-build-command: ${{ steps.validate-tooling.outputs.IMAGE_BUILD_COMMAND }}
    output-sub-path: ${{ steps.kpm.outputs.OUTPUT_SUB_PATH }}
    token-delimiter-style: ${{ steps.kpm.outputs.TOKEN_DELIMITER_STYLE }}
    token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
    secrets-sub-path: ${{ steps.kpm.outputs.SECRETS_SUB_PATH }}
    env-deploy-mode: ${{ steps.kpm.outputs.ENV_DEPLOY_MODE }}
    cluster-scoped-delegation: ${{ steps.kpm.outputs.ENV_CLUSTER_SCOPED_DELEGATION }}
    cluster-scoped-kinds-file: ${{ steps.kpm.outputs.MANIFESTS_CLUSTER_SCOPED_KINDS_FILE }}
    env-deploy-base-image-registry: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_REGISTRY }}
    env-deploy-base-image-include-namespace: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_INCLUDE_NAMESPACE }}
    env-deploy-base-image-namespace: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_NAMESPACE }}
    env-deploy-base-image-family: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_FAMILY }}
    env-deploy-base-image-version: ${{ steps.kpm.outputs.ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_VERSION }}

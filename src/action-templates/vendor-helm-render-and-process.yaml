name: 'Vendor Helm Render and Process'
description: 'Fetches a vendor helm chart, renders it, and processes output into individual kubernetes manifests'

inputs:
  # INJECT-INPUT: output-sub-path
  # INJECT-INPUT: vendor-helm-rendered
  # INJECT-INPUT: docker-push-image-list
  # INJECT-INPUT: image-build-command
  # INJECT-INPUT: docker-platform
  # INJECT-INPUT: token-substitution

  docker-target-registry:
    description: 'Target container registry for retagged images (from load-final-kaptainpm-yaml)'
    required: false
  docker-target-namespace:
    description: 'Target namespace for retagged images (from load-final-kaptainpm-yaml)'
    required: false

  project-name:
    description: 'Project name (used as helm release name)'
    required: true
    type: string
  docker-tag:
    description: 'Docker tag from versions-and-naming (required when image-retags configured)'
    required: false
  docker-image-name:
    description: 'Docker image name from versions-and-naming (required when image-retags configured)'
    required: false
  docker-image-name-override:
    description: 'Inbound override from KaptainPM.yaml (passed through if set)'
    required: false

outputs:
  DOCKER_IMAGE_NAME_OVERRIDE:
    description: 'Docker image name override for the token override step'
    value: ${{ steps.helm-render.outputs.DOCKER_IMAGE_NAME_OVERRIDE }}

runs:
  using: 'composite'
  steps:
    # INJECT: check-workflow-repository

    - name: Render and process helm chart
      id: helm-render
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        REPOSITORY_OWNER: ${{ github.repository_owner }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        DOCKER_PUSH_IMAGE_LIST_FILE: ${{ inputs.docker-push-image-list-file }}
        VENDOR_HELM_RENDERED_REPO_URL: ${{ inputs.vendor-helm-rendered-repo-url }}
        VENDOR_HELM_RENDERED_CHART_NAME: ${{ inputs.vendor-helm-rendered-chart-name }}
        VENDOR_HELM_RENDERED_OCI_CHART: ${{ inputs.vendor-helm-rendered-oci-chart }}
        VENDOR_HELM_RENDERED_MOVE_FILES: ${{ inputs.vendor-helm-rendered-move-files }}
        VENDOR_HELM_RENDERED_SED_REPLACE: ${{ inputs.vendor-helm-rendered-sed-replace }}
        VENDOR_HELM_RENDERED_YQ_TRANSFORM: ${{ inputs.vendor-helm-rendered-yq-transform }}
        VENDOR_HELM_RENDERED_IMAGE_RETAGS: ${{ inputs.vendor-helm-rendered-image-retags }}
        VENDOR_HELM_RENDERED_USE_PROJECT_NAME_AS_FULLNAME_OVERRIDE: ${{ inputs.vendor-helm-rendered-use-project-name-as-fullname-override }}
        PROJECT_NAME: ${{ inputs.project-name }}
        DOCKER_TAG: ${{ inputs.docker-tag }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        DOCKER_IMAGE_NAME_OVERRIDE: ${{ inputs.docker-image-name-override }}
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        DOCKER_PLATFORM: ${{ inputs.docker-platform }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/main/vendor-helm-render-and-process"

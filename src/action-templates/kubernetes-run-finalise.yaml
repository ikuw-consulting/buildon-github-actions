name: 'Kubernetes Run Finalise'
description: 'Post-substitution finalisation of the run''s workload aggregate: yq patches, post-substitution gate (unresolved tokens, secret coverage), sensitive-resource signoff gate, resource checksum pass, env-content-data ConfigMap emit'

inputs:
  # Action-specific inputs
  project-name:
    description: 'Run name (run-* / run-platform-*)'
    required: true
  version:
    description: 'Version'
    required: true
  build-kind:
    description: 'kubernetes-run-environment | kubernetes-run-platform-meta-environment (from load-final-kaptainpm-yaml)'
    required: true
  environment-workload-contents-sub-path:
    description: 'The assembled+substituted workload tree (from the aggregate step)'
    required: true

  # INJECT-INPUT: output-sub-path
  # INJECT-INPUT: token-substitution
  # INJECT-INPUT: image-build-command
  # INJECT-INPUT: run-environment-settings
  # INJECT-INPUT: run-finalise-settings

outputs:
  environment-workload-contents-sub-path:
    description: 'The finalised workload tree (manifests-final): what the consumption report, lineage record and package steps work on'
    value: ${{ steps.run-finalise.outputs.ENVIRONMENT_WORKLOAD_CONTENTS_SUB_PATH }}

runs:
  using: 'composite'
  steps:
    # INJECT: check-workflow-repository

    - name: Finalise run workload tree
      id: run-finalise
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}
        BUILD_KIND: ${{ inputs.build-kind }}
        ENVIRONMENT_WORKLOAD_CONTENTS_SUB_PATH: ${{ inputs.environment-workload-contents-sub-path }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
        SECRETS_SUB_PATH: ${{ inputs.secrets-sub-path }}
        MANIFESTS_SIGNOFFS_SUB_PATH: ${{ inputs.signoffs-sub-path }}
        MANIFESTS_SIGNOFFS_KINDS_FILE: ${{ inputs.signoffs-kinds-file }}
        MANIFESTS_TRUSTED_CONTRIBUTORS_ONLY: ${{ inputs.trusted-contributors-only }}
        RESOURCE_CHECKSUM_LENGTH: ${{ inputs.checksum-length }}
        MANIFESTS_CHECKSUM_ORDER_FILE: ${{ inputs.checksum-order-file }}
        ENV_CHECKSUM_SECRETS_TIMING: ${{ inputs.checksum-secrets-timing }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_REGISTRY: ${{ inputs.env-deploy-base-image-registry }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_INCLUDE_NAMESPACE: ${{ inputs.env-deploy-base-image-include-namespace }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_NAMESPACE: ${{ inputs.env-deploy-base-image-namespace }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_FAMILY: ${{ inputs.env-deploy-base-image-family }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_VERSION: ${{ inputs.env-deploy-base-image-version }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/main/kubernetes-run-finalise"

name: 'Kubernetes Run Image Deploy Manifests Substitute'
description: 'Token substitution over the deploy-manifests set - the stock substitute pinned at the deploy-manifests block dirs by its wrapper script'

inputs:
  # Action-specific inputs
  project-name:
    description: 'Run name (run-* / run-platform-*)'
    required: true
  version:
    description: 'Version (carried for log clarity)'
    required: true

  # INJECT-INPUT: output-sub-path
  # INJECT-INPUT: token-substitution
  # INJECT-INPUT: run-environment-settings

runs:
  using: 'composite'
  steps:
    - name: Substitute deploy-manifests
      id: substitute
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        CONFIG_VALUE_TRAILING_NEWLINE: ${{ inputs.config-value-trailing-newline }}
        TOKEN_SUBSTITUTION_PASSES: ${{ inputs.token-substitution-passes }}
        ENV_ENVIRONMENT_DEPLOY_SOURCE_BASE_PATH: ${{ inputs.env-deploy-source-base-path }}
      run: "${{ github.action_path }}/../../scripts/main/kubernetes-run-image-deploy-manifests-substitute"

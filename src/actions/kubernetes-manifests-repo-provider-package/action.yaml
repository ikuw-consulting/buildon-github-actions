name: 'Kubernetes Manifests Repo Provider Package'
description: 'Packages manifests for repo provider (builds docker image). Does NOT publish.'

inputs:
  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Docker push image list file path
  docker-push-image-list-file:
    description: 'Path to file listing image URIs for docker-push-all (set by docker-registry-logins)'
    required: true
  # Manifests source
  manifests-sub-path:
    description: 'Directory containing Kubernetes manifests (relative)'
    required: false
    default: 'src/kubernetes'
  # Manifests packaging
  manifests-repo-provider-type:
    description: 'Repo provider type for manifest storage (default: docker, currently the only supported provider)'
    required: false
    default: 'docker'
  manifests-packaging-base-image:
    description: 'Base image for manifest packaging (default: scratch)'
    required: false
    default: ''
  # Docker registry logins
  docker-registry-logins:
    description: 'YAML config for Docker registry logins (registry URL as key)'
    required: false
    default: ''
  # Docker target config
  docker-target-registry:
    description: 'Target container registry domain (defaults to ghcr.io on GH Actions)'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Path segment between registry and image name (defaults to lower cased org name or user ID on GH Actions)'
    required: false
    default: ''
  # Docker push targets
  docker-push-targets:
    description: 'JSON array of additional push targets [{registry, namespace?}]'
    required: false
    default: ''

  # Action-specific inputs
  manifests-zip-sub-path:
    description: 'Relative path to the directory containing the manifests zip'
    required: true
  manifests-zip-file-name:
    description: 'Filename of the manifests zip'
    required: true
  docker-image-name:
    description: 'Image name (from version generator)'
    required: false
    default: ''
  docker-tag:
    description: 'Tag for target image (includes prerelease suffix if applicable)'
    required: false
    default: ''
  project-name:
    description: 'Project name (for future non-docker providers)'
    required: false
    default: ''
  version:
    description: 'Version tag (for future non-docker providers)'
    required: false
    default: ''
  contract-zip-sub-path:
    description: 'Directory containing the contract zip (required - consumers resolve a bundle through its contract)'
    required: true
  contract-zip-file-name:
    description: 'Filename of the contract zip (required)'
    required: true
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true

outputs:
  # --- Pass-through for publish step ---
  manifests-uri:
    description: 'Manifests location (for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_URI }}
  manifests-artifact-sub-path:
    description: 'Relative path to packaged artifact (for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_ARTIFACT_SUB_PATH }}
  manifests-zip-sub-path:
    description: 'Relative path to directory containing manifests zip (pass through for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_ZIP_SUB_PATH }}
  manifests-zip-file-name:
    description: 'Filename for manifests zip (pass through for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_ZIP_FILE_NAME }}
  version:
    description: 'Version/tag (pass through for publish step, for future non-docker providers)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_VERSION }}

  # --- REPO_PROVIDER_* outputs (for publish step) ---
  repo-provider-url:
    description: 'Computed REPO_PROVIDER_URL (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_URL }}
  repo-provider-namespace:
    description: 'Computed REPO_PROVIDER_NAMESPACE (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_NAMESPACE }}
  repo-provider-name:
    description: 'Computed REPO_PROVIDER_NAME (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_NAME }}
  repo-provider-version:
    description: 'Computed REPO_PROVIDER_VERSION (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_VERSION }}

runs:
  using: 'composite'
  steps:
    # ==========================================================================
    # Package manifests for repo provider
    # Script computes REPO_PROVIDER_* from docker/project inputs and outputs them
    # ==========================================================================
    - name: Package manifests for repo provider
      id: package
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        MANIFESTS_REPO_PROVIDER_TYPE: ${{ inputs.manifests-repo-provider-type }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        DOCKER_PUSH_IMAGE_LIST_FILE: ${{ inputs.docker-push-image-list-file }}
        MANIFESTS_PACKAGING_BASE_IMAGE: ${{ inputs.manifests-packaging-base-image }}

        # --- Pass-through inputs ---
        MANIFESTS_ZIP_SUB_PATH: ${{ inputs.manifests-zip-sub-path }}
        MANIFESTS_ZIP_FILE_NAME: ${{ inputs.manifests-zip-file-name }}
        CONTRACT_ZIP_SUB_PATH: ${{ inputs.contract-zip-sub-path }}
        CONTRACT_ZIP_FILE_NAME: ${{ inputs.contract-zip-file-name }}

        # --- Inputs for REPO_PROVIDER_* computation (done by script) ---
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        DOCKER_TAG: ${{ inputs.docker-tag }}
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}

        # --- Auth (not computable by script) ---
        REPO_PROVIDER_AUTH_TOKEN: ${{ github.token }}
        REPO_PROVIDER_AUTH_USER: ${{ github.actor }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
      run: "${{ github.action_path }}/../../scripts/main/kubernetes-manifests-repo-provider-package"

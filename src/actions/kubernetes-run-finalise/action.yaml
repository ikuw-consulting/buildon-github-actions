name: 'Kubernetes Run Finalise'
description: 'Post-substitution finalisation of the run''s workload aggregate: yq patches, post-substitution gate (unresolved tokens, secret coverage), sensitive-resource signoff gate, resource checksum pass, env-content-data ConfigMap emit'

inputs:
  # Action-specific inputs
  project-name:
    description: 'Run name (run-* / run-platform-*)'
    required: true
  version:
    description: 'Version'
    required: true
  build-kind:
    description: 'kubernetes-run-environment | kubernetes-run-platform-meta-environment (from load-final-kaptainpm-yaml)'
    required: true
  environment-workload-contents-sub-path:
    description: 'The assembled+substituted workload tree (from the aggregate step)'
    required: true

  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Token substitution
  token-delimiter-style:
    description: 'Token delimiter syntax for variables (shell, mustache, helm, erb, github-actions, blade, stringtemplate, ognl, t4, swift)'
    required: false
    default: 'shell'
  token-name-style:
    description: 'Case style for token names (UPPER_SNAKE, lower_snake, lower-kebab, UPPER-KEBAB, camelCase, PascalCase, lower.dot, UPPER.DOT)'
    required: false
    default: 'PascalCase'
  token-name-validation:
    description: 'How to validate user token names (MATCH = must match token-name-style, ALL = accept any valid name)'
    required: false
    default: 'MATCH'
  config-sub-path:
    description: 'Directory containing user-defined token files (relative)'
    required: false
    default: 'src/config'
  config-value-trailing-newline:
    description: 'How to handle trailing newlines in config values (strip-for-single-line, preserve-all, always-strip-one-newline)'
    required: false
    default: 'strip-for-single-line'
  token-substitution-passes:
    description: 'Number of times to run the token substitution pass (for nested token references)'
    required: false
    default: '1'
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true
  # Run environment settings
  # Empty values use the defaults in src/scripts/defaults/environments.bash.
  env-deploy-source-base-path:
    description: 'Source dir for the deploy-image manifests (relative)'
    required: false
    default: ''
  generate-ideal-environment-deploy-manifests:
    description: 'Generate the ideal deploy manifests (true) or consume supplied ones (false)'
    required: false
    default: ''
  image-deploy-manifests-apply-mode:
    description: 'How a run-platform applies this environment deploy-manifests set - seed-and-compare or enforce-state-normally, environment only'
    required: false
    default: ''
  env-deploy-mode:
    description: 'deployment | job (generate-mode only)'
    required: false
    default: ''
  job-post-deploy-sleep-after-success:
    description: 'Job mode: how long the deploy pod stays up after a successful deploy, e.g. 10m'
    required: false
    default: ''
  job-post-deploy-sleep-after-failure:
    description: 'Job mode: how long the deploy pod stays up after a failed deploy, e.g. 24h'
    required: false
    default: ''
  image-pull-secrets:
    description: 'ENABLED | DISABLED - whether the generated deploy workloads reference the registry pull secret (generate-mode only)'
    required: false
    default: ''
  namespace-additional-labels:
    description: 'Extra labels (comma-separated key=value) for the Namespace generated into the deploy-manifests set (generate-mode only)'
    required: false
    default: ''
  namespace-additional-annotations:
    description: 'Extra annotations (comma-separated key=value) for the Namespace generated into the deploy-manifests set (generate-mode only)'
    required: false
    default: ''
  auto-generate-image-pull-secrets:
    description: 'true | false - generate a dockerconfigjson Secret for each imagePullSecrets name the workload contents reference'
    required: false
    default: ''
  image-auto-update-provider:
    description: 'keel | keelson | none'
    required: false
    default: ''
  image-auto-update-policy:
    description: 'patch | minor | major | all | force (force is keel-only)'
    required: false
    default: ''
  image-auto-update-trigger:
    description: 'poll | default'
    required: false
    default: ''
  image-auto-update-poll-schedule:
    description: 'Single-unit duration, e.g. 1m (rendered per provider)'
    required: false
    default: ''
  image-auto-update-field-manager-strategy:
    description: 'mimic | patch | claim (keelson only, ignored otherwise)'
    required: false
    default: ''
  cluster-scoped-delegation:
    description: 'self | parent (env-only; RP is the root and always self)'
    required: false
    default: ''
  cluster-scoped-kinds-file:
    description: 'File NAME (versioned) of the cluster-scoped Kind list in fixed src/data/cluster-scoped-kinds/'
    required: false
    default: ''
  env-deploy-base-image-registry:
    description: 'Registry of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-include-namespace:
    description: 'true (default) includes the namespace segment in the composed base image; false ignores the namespace value and condenses the segment out'
    required: false
    default: ''
  env-deploy-base-image-namespace:
    description: 'Namespace segment of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-family:
    description: 'Family of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-version:
    description: 'Version of the composed environment deploy base image'
    required: false
    default: ''
  allow-local-manifests-override:
    description: 'When true, local src/kubernetes files override colliding child-contributed paths (warn per replacement)'
    required: false
    default: ''
  fail-on-unreferenced-config-or-secrets:
    description: 'When true (default), config/secret value files no token references fail the build; false warns'
    required: false
    default: ''
  secrets-sub-path:
    description: 'Directory containing encrypted secret value files (relative)'
    required: false
    default: ''
  # Run finalise settings
  # Empty values use the defaults in src/scripts/defaults/environments.bash.
  signoffs-sub-path:
    description: 'Directory containing sensitive-resource signoff files (relative)'
    required: false
    default: ''
  signoffs-kinds-file:
    description: 'File NAME (versioned) of the sensitive-Kind list in fixed src/data/signoff-kinds/'
    required: false
    default: ''
  trusted-contributors-only:
    description: 'true disables the signoff gate entirely (master disable for trusted-contributor-only repos)'
    required: false
    default: ''
  checksum-length:
    description: 'Resource checksum suffix length in Base32 chars'
    required: false
    default: ''
  checksum-order-file:
    description: 'File NAME (versioned) of the ordered-kinds list in fixed src/data/resource-order/'
    required: false
    default: ''
  checksum-secrets-timing:
    description: 'build (default) | deploy - when the Secret checksum markers resolve'
    required: false
    default: ''

outputs:
  environment-workload-contents-sub-path:
    description: 'The finalised workload tree (manifests-final): what the consumption report, lineage record and package steps work on'
    value: ${{ steps.run-finalise.outputs.ENVIRONMENT_WORKLOAD_CONTENTS_SUB_PATH }}

runs:
  using: 'composite'
  steps:
    # The actions pass their state to each other through one job's workspace, so
    # each refuses to run unless the workflow running it lives in this repository.
    - name: Check workflow repository
      if: job.workflow_repository != github.action_repository && success()
      shell: bash
      env:
        WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        echo "::error::This action is part of the Kaptain BuildOn GitHub Actions repo or a fork thereof. It is not intended tbe used in a standalone fashion as part of any adhoc workflow elsewhere."
        echo "::error::This action is internal to ${ACTION_REPOSITORY} and only runs from that repository's own workflows. It was run by a workflow in ${WORKFLOW_REPOSITORY:-an unknown repository}."
        echo "::error::Documentation on how to use the upstream Kaptain buildon-github-actions workflows can be found here: https://github.com/kube-kaptain/buildon-github-actions/tree/main/examples"
        exit 1

    - name: Finalise run workload tree
      id: run-finalise
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}
        BUILD_KIND: ${{ inputs.build-kind }}
        ENVIRONMENT_WORKLOAD_CONTENTS_SUB_PATH: ${{ inputs.environment-workload-contents-sub-path }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
        SECRETS_SUB_PATH: ${{ inputs.secrets-sub-path }}
        MANIFESTS_SIGNOFFS_SUB_PATH: ${{ inputs.signoffs-sub-path }}
        MANIFESTS_SIGNOFFS_KINDS_FILE: ${{ inputs.signoffs-kinds-file }}
        MANIFESTS_TRUSTED_CONTRIBUTORS_ONLY: ${{ inputs.trusted-contributors-only }}
        RESOURCE_CHECKSUM_LENGTH: ${{ inputs.checksum-length }}
        MANIFESTS_CHECKSUM_ORDER_FILE: ${{ inputs.checksum-order-file }}
        ENV_CHECKSUM_SECRETS_TIMING: ${{ inputs.checksum-secrets-timing }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_REGISTRY: ${{ inputs.env-deploy-base-image-registry }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_INCLUDE_NAMESPACE: ${{ inputs.env-deploy-base-image-include-namespace }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_NAMESPACE: ${{ inputs.env-deploy-base-image-namespace }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_FAMILY: ${{ inputs.env-deploy-base-image-family }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_VERSION: ${{ inputs.env-deploy-base-image-version }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/main/kubernetes-run-finalise"

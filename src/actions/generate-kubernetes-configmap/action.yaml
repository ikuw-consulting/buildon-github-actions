name: 'Generate Kubernetes ConfigMap'
description: 'Generates a Kubernetes ConfigMap manifest from files in a directory'

inputs:
  # Required context
  project-name:
    description: 'Project name (required)'
    required: true

  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Kubernetes generation
  kubernetes-global-additional-labels:
    description: 'Additional labels for all Kubernetes manifests (comma-separated key=value)'
    required: false
    default: ''
  kubernetes-global-additional-annotations:
    description: 'Additional annotations for all Kubernetes manifests (comma-separated key=value)'
    required: false
    default: ''
  # Kubernetes ConfigMap generation
  kubernetes-configmap-sub-path:
    description: 'Directory containing ConfigMap data files (relative)'
    required: false
    default: 'src/configmap'
  kubernetes-configmap-name-suffix:
    description: 'Optional suffix for ConfigMap name and filename'
    required: false
    default: ''
  kubernetes-configmap-combined-sub-path:
    description: 'Sub-path within combined/ for output'
    required: false
    default: ''
  kubernetes-configmap-name-checksum-injection:
    description: 'Enable checksum injection suffix in ConfigMap name'
    required: false
    default: 'true'
  kubernetes-configmap-additional-labels:
    description: 'Additional labels specific to ConfigMap (comma-separated key=value)'
    required: false
    default: ''
  kubernetes-configmap-additional-annotations:
    description: 'Additional annotations specific to ConfigMap (comma-separated key=value)'
    required: false
    default: ''
  # Build-context inputs for kubernetes manifest generators. These flow through
  # to the kaptain.org/* annotations on generated resources. Empty values are
  # safe; the generator omits the corresponding annotation when unset.
  image-uri:
    description: 'Full container image URI for the kaptain.org/image-uri annotation (empty when no image is built)'
    required: false
    default: ''
  # Token substitution
  token-delimiter-style:
    description: 'Token delimiter syntax for variables (shell, mustache, helm, erb, github-actions, blade, stringtemplate, ognl, t4, swift)'
    required: false
    default: 'shell'
  token-name-style:
    description: 'Case style for token names (UPPER_SNAKE, lower_snake, lower-kebab, UPPER-KEBAB, camelCase, PascalCase, lower.dot, UPPER.DOT)'
    required: false
    default: 'PascalCase'
  token-name-validation:
    description: 'How to validate user token names (MATCH = must match token-name-style, ALL = accept any valid name)'
    required: false
    default: 'MATCH'
  config-sub-path:
    description: 'Directory containing user-defined token files (relative)'
    required: false
    default: 'src/config'
  config-value-trailing-newline:
    description: 'How to handle trailing newlines in config values (strip-for-single-line, preserve-all, always-strip-one-newline)'
    required: false
    default: 'strip-for-single-line'
  token-substitution-passes:
    description: 'Number of times to run the token substitution pass (for nested token references)'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    # The actions pass their state to each other through one job's workspace, so
    # each refuses to run unless the workflow running it lives in this repository.
    - name: Check workflow repository
      if: job.workflow_repository != github.action_repository && success()
      shell: bash
      env:
        WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        echo "::error::This action is part of the Kaptain BuildOn GitHub Actions repo or a fork thereof. It is not intended tbe used in a standalone fashion as part of any adhoc workflow elsewhere."
        echo "::error::This action is internal to ${ACTION_REPOSITORY} and only runs from that repository's own workflows. It was run by a workflow in ${WORKFLOW_REPOSITORY:-an unknown repository}."
        echo "::error::Documentation on how to use the upstream Kaptain buildon-github-actions workflows can be found here: https://github.com/kube-kaptain/buildon-github-actions/tree/main/examples"
        exit 1

    - name: Generate ConfigMap manifest
      id: generate
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        REPOSITORY_OWNER: ${{ github.repository_owner }}
        SOURCE_REPO: ${{ github.repository }}
        IMAGE_URI: ${{ inputs.image-uri }}
        # Required context
        PROJECT_NAME: ${{ inputs.project-name }}
        # Global settings
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        KUBERNETES_GLOBAL_ADDITIONAL_LABELS: ${{ inputs.kubernetes-global-additional-labels }}
        KUBERNETES_GLOBAL_ADDITIONAL_ANNOTATIONS: ${{ inputs.kubernetes-global-additional-annotations }}
        # ConfigMap settings
        KUBERNETES_CONFIGMAP_SUB_PATH: ${{ inputs.kubernetes-configmap-sub-path }}
        KUBERNETES_CONFIGMAP_NAME_SUFFIX: ${{ inputs.kubernetes-configmap-name-suffix }}
        KUBERNETES_CONFIGMAP_COMBINED_SUB_PATH: ${{ inputs.kubernetes-configmap-combined-sub-path }}
        KUBERNETES_CONFIGMAP_NAME_CHECKSUM_INJECTION: ${{ inputs.kubernetes-configmap-name-checksum-injection }}
        KUBERNETES_CONFIGMAP_ADDITIONAL_LABELS: ${{ inputs.kubernetes-configmap-additional-labels }}
        KUBERNETES_CONFIGMAP_ADDITIONAL_ANNOTATIONS: ${{ inputs.kubernetes-configmap-additional-annotations }}
        # Token substitution
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/generators/generate-kubernetes-configmap"

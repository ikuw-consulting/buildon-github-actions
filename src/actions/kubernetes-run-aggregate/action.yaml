name: 'Kubernetes Run Aggregate'
description: 'Workload-contents aggregate for env and RP builds (kind derived from the project-name prefix): resolves spec.contents uniformly, includes the own deploy-manifests set self-referencing, folds local manifests, and ends at the assembled normalised tree'

inputs:
  # Action-specific inputs
  project-name:
    description: 'Run name (run-* for environments, run-platform-* for platforms)'
    required: true
  version:
    description: 'Version'
    required: true
  local-manifests-sub-path:
    description: 'Local run manifests dir (relative)'
    required: false
    default: 'src/kubernetes'
  is-release:
    description: 'When true, content version ranges resolve to release-only versions'
    required: false
    default: 'false'

  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Token substitution
  token-delimiter-style:
    description: 'Token delimiter syntax for variables (shell, mustache, helm, erb, github-actions, blade, stringtemplate, ognl, t4, swift)'
    required: false
    default: 'shell'
  token-name-style:
    description: 'Case style for token names (UPPER_SNAKE, lower_snake, lower-kebab, UPPER-KEBAB, camelCase, PascalCase, lower.dot, UPPER.DOT)'
    required: false
    default: 'PascalCase'
  token-name-validation:
    description: 'How to validate user token names (MATCH = must match token-name-style, ALL = accept any valid name)'
    required: false
    default: 'MATCH'
  config-sub-path:
    description: 'Directory containing user-defined token files (relative)'
    required: false
    default: 'src/config'
  config-value-trailing-newline:
    description: 'How to handle trailing newlines in config values (strip-for-single-line, preserve-all, always-strip-one-newline)'
    required: false
    default: 'strip-for-single-line'
  token-substitution-passes:
    description: 'Number of times to run the token substitution pass (for nested token references)'
    required: false
    default: '1'
  # Docker registry logins
  docker-registry-logins:
    description: 'YAML config for Docker registry logins (registry URL as key)'
    required: false
    default: ''
  # Docker target config
  docker-target-registry:
    description: 'Target container registry domain (defaults to ghcr.io on GH Actions)'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Path segment between registry and image name (defaults to lower cased org name or user ID on GH Actions)'
    required: false
    default: ''
  # Docker push targets
  docker-push-targets:
    description: 'JSON array of additional push targets [{registry, namespace?}]'
    required: false
    default: ''
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true
  # Env/RP-scope run settings (spec.main.environment
  # projections plus the shared global paths the run steps consume).
  # Empty values fall through to the script defaults in
  # src/scripts/defaults/environments.bash.
  env-deploy-source-base-path:
    description: 'Source dir for the deploy-image manifests (relative)'
    required: false
    default: ''
  generate-ideal-environment-deploy-manifests:
    description: 'Generate the ideal deploy manifests (true) or consume supplied ones (false)'
    required: false
    default: ''
  image-deploy-manifests-apply-mode:
    description: 'How a run-platform applies this environment deploy-manifests set - seed-and-compare or enforce-state-normally, environment only'
    required: false
    default: ''
  env-deploy-mode:
    description: 'deployment | job (generate-mode only)'
    required: false
    default: ''
  image-auto-update-provider:
    description: 'keel | keelson | none'
    required: false
    default: ''
  image-auto-update-policy:
    description: 'patch | minor | major | all | force (force is keel-only)'
    required: false
    default: ''
  image-auto-update-trigger:
    description: 'poll | default'
    required: false
    default: ''
  image-auto-update-poll-schedule:
    description: 'Single-unit duration, e.g. 1m (rendered per provider)'
    required: false
    default: ''
  image-auto-update-field-manager-strategy:
    description: 'mimic | patch | claim (keelson only, ignored otherwise)'
    required: false
    default: ''
  cluster-scoped-delegation:
    description: 'self | parent (env-only; RP is the root and always self)'
    required: false
    default: ''
  cluster-scoped-kinds-file:
    description: 'File NAME (versioned) of the cluster-scoped Kind list in fixed src/data/cluster-scoped-kinds/'
    required: false
    default: ''
  env-deploy-base-image-registry:
    description: 'Registry of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-include-namespace:
    description: 'true (default) includes the namespace segment in the composed base image; false ignores the namespace value and condenses the segment out'
    required: false
    default: ''
  env-deploy-base-image-namespace:
    description: 'Namespace segment of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-family:
    description: 'Family of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-version:
    description: 'Version of the composed environment deploy base image'
    required: false
    default: ''
  allow-local-manifests-override:
    description: 'When true, local src/kubernetes files override colliding child-contributed paths (warn per replacement)'
    required: false
    default: ''
  fail-on-unreferenced-config-or-secrets:
    description: 'When true (default), config/secret value files no token references fail the build; false warns'
    required: false
    default: ''
  secrets-sub-path:
    description: 'Directory containing encrypted secret value files (relative)'
    required: false
    default: ''
  # The cleanup policy ConfigMap is emitted here, pre-substitution: it is a
  # pure projection of the loaded KaptainPM values, so it belongs in the
  # tree before the substitution pass rather than being injected later.
  # The whole cleanUp block as one JSON value, exactly as configured.
  #
  # One input rather than a field-per-var fan-out: the structure IS the
  # interface the deploy scripts consume from the cleanup policy ConfigMap,
  # so flattening it here only to rebuild it downstream would be two
  # opportunities to diverge and a new input for every field the schema ever
  # gains. The nested parts - matcher lists, overseen-namespace entries -
  # could not survive flattening anyway.
  #
  # Empty falls through to the safe defaults (preview only, remove nothing),
  # applied structurally where the policy document is built in
  # kubernetes-run-aggregate.
  clean-up:
    description: 'The whole spec.main.<kind>.cleanUp block as JSON, from load-final-kaptainpm-yaml'
    required: false
    default: ''

outputs:
  environment-name:
    description: 'Environment name (PROJECT_NAME verbatim, both kinds)'
    value: ${{ steps.run-aggregate.outputs.ENVIRONMENT_NAME }}
  environment-short-name:
    description: 'Environment short name (kind prefix stripped)'
    value: ${{ steps.run-aggregate.outputs.ENVIRONMENT_SHORT_NAME }}
  environment-workload-contents-file:
    description: 'Path to the markdown bullet list of spec.contents entries'
    value: ${{ steps.run-aggregate.outputs.ENVIRONMENT_WORKLOAD_CONTENTS_FILE }}

runs:
  using: 'composite'
  steps:
    - name: Aggregate run contents
      id: run-aggregate
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}
        MANIFESTS_SUB_PATH: ${{ inputs.local-manifests-sub-path }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
        CONFIG_SUB_PATH: ${{ inputs.config-sub-path }}
        CONFIG_VALUE_TRAILING_NEWLINE: ${{ inputs.config-value-trailing-newline }}
        TOKEN_SUBSTITUTION_PASSES: ${{ inputs.token-substitution-passes }}
        SECRETS_SUB_PATH: ${{ inputs.secrets-sub-path }}
        ENV_ALLOW_LOCAL_MANIFESTS_OVERRIDE: ${{ inputs.allow-local-manifests-override }}
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        IS_RELEASE: ${{ inputs.is-release }}
        ENV_CLEAN_UP: ${{ inputs.clean-up }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_REGISTRY: ${{ inputs.env-deploy-base-image-registry }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_INCLUDE_NAMESPACE: ${{ inputs.env-deploy-base-image-include-namespace }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_NAMESPACE: ${{ inputs.env-deploy-base-image-namespace }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_FAMILY: ${{ inputs.env-deploy-base-image-family }}
        ENV_ENVIRONMENT_DEPLOY_BASE_IMAGE_VERSION: ${{ inputs.env-deploy-base-image-version }}
      run: "${{ github.action_path }}/../../scripts/main/kubernetes-run-aggregate"

name: 'Load Final KaptainPM YAML'
description: 'Reads the final merged KaptainPM.yaml and exports its settings as outputs'

inputs:
  build-kind:
    description: 'Build kind identifier (workflow/reference script name)'
    required: true
  # Registry defaults (a KaptainPM.yaml value wins)
  docker-target-registry:
    description: 'Default target registry, used when KaptainPM.yaml sets none'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Default target namespace, used when KaptainPM.yaml sets none'
    required: false
    default: ''
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true

# Every name the script can export, generated from the script itself so the
# declared set cannot drift from it. An undeclared output would arrive empty.
outputs:
  ADDITIONAL_RELEASE_BRANCHES:
    description: 'Computed by load-final-kaptainpm-yaml'
    value: ${{ steps.load.outputs.ADDITIONAL_RELEASE_BRANCHES }}
  ALLOW_LOCAL_DEFAULTS_OVERRIDE:
    description: 'KaptainPM.yaml value at spec.main.manifests.defaults.allowLocalOverride'
    value: ${{ steps.load.outputs.ALLOW_LOCAL_DEFAULTS_OVERRIDE }}
  ALLOW_LOCAL_MANIFESTS_OVERRIDE:
    description: 'KaptainPM.yaml value at spec.main.manifests.allowLocalOverride'
    value: ${{ steps.load.outputs.ALLOW_LOCAL_MANIFESTS_OVERRIDE }}
  BUILD_KIND:

name: 'Kubernetes Run Image Deploy Manifests Package Prepare'
description: 'Prepares the deploy-manifests set for packaging - the stock package-prepare pinned at the deploy-manifests block dirs by its wrapper script'

inputs:
  # Action-specific inputs (the The deploy-manifests dirs are pinned by the wrapper's
  # context lib; local-override toggles do not apply to the staged set)
  allow-local-defaults-override:
    description: 'When true, local defaults override foreign additional-defaults on collision (warn)'
    required: false
    default: 'false'
  allow-local-manifests-override:
    description: 'When true, local manifests override foreign additional-manifests on collision (warn)'
    required: false
    default: 'false'

  # Step outputs from the versions-and-naming action.
  # Consumed by hook actions and any action that needs version/naming values.

  # Core inputs for almost everything
  project-name:
    description: 'Project name'
    required: true
  version:
    description: 'Version in plain normal format'
    required: true
  docker-image-name:
    description: 'Docker image name - project name prefix in front then a slash then project name'
    required: true

  # Subset/superset versions useful for certain situations
  version-major:
    description: 'Major version part'
    required: true
  version-minor:
    description: 'Minor version part'
    required: true
  version-patch:
    description: 'Patch version part'
    required: true
  version-2-part:
    description: 'Version padded/truncated to 2 parts'
    required: true
  version-3-part:
    description: 'Version padded/truncated to 3 parts'
    required: true
  version-4-part:
    description: 'Version padded/truncated to 4 parts'
    required: true

  # DNS safe versions for Kubernetes and other naming tasks
  version-dns-safe:
    description: 'VERSION with dots replaced by hyphens'
    required: true
  version-2-part-dns-safe:
    description: 'VERSION_2_PART with dots replaced by hyphens'
    required: true
  version-3-part-dns-safe:
    description: 'VERSION_3_PART with dots replaced by hyphens'
    required: true
  version-4-part-dns-safe:
    description: 'VERSION_4_PART with dots replaced by hyphens'
    required: true

  # PR/local vs release build inputs
  is-release:
    description: 'Whether this is a release build'
    required: true
  docker-tag:
    description: 'Docker tag - separate for PR and local builds to not collide'
    required: true
  git-tag:
    description: 'Git tag - separate for PR and local builds to not collide'
    required: true
  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'

  # Action-specific optional inputs (passed from docker build)
  docker-image-full-uri:
    description: 'Full Docker image URI for variable substitution (optional)'
    required: false
    default: ''
  docker-target-registry:
    description: 'Target registry for variable substitution (optional)'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Target namespace for variable substitution (optional)'
    required: false
    default: ''

  # Token substitution
  token-delimiter-style:
    description: 'Token delimiter syntax for variables (shell, mustache, helm, erb, github-actions, blade, stringtemplate, ognl, t4, swift)'
    required: false
    default: 'shell'
  token-name-style:
    description: 'Case style for token names (UPPER_SNAKE, lower_snake, lower-kebab, UPPER-KEBAB, camelCase, PascalCase, lower.dot, UPPER.DOT)'
    required: false
    default: 'PascalCase'
  token-name-validation:
    description: 'How to validate user token names (MATCH = must match token-name-style, ALL = accept any valid name)'
    required: false
    default: 'MATCH'
  config-sub-path:
    description: 'Directory containing user-defined token files (relative)'
    required: false
    default: 'src/config'
  config-value-trailing-newline:
    description: 'How to handle trailing newlines in config values (strip-for-single-line, preserve-all, always-strip-one-newline)'
    required: false
    default: 'strip-for-single-line'
  token-substitution-passes:
    description: 'Number of times to run the token substitution pass (for nested token references)'
    required: false
    default: '1'
  # Env/RP-scope run settings (spec.main.{environment,runPlatform}
  # projections plus the shared global paths the run steps consume).
  # Empty values fall through to the script defaults in
  # src/scripts/defaults/environments.bash.
  env-deploy-source-base-path:
    description: 'Source dir for the deploy-image manifests (relative)'
    required: false
    default: ''
  generate-ideal-environment-deploy-manifests:
    description: 'Generate the ideal deploy manifests (true) or consume supplied ones (false)'
    required: false
    default: ''
  image-deploy-manifests-apply-mode:
    description: 'How a run-platform applies this environment deploy-manifests set - seed-and-compare or enforce-state-normally, environment only'
    required: false
    default: ''
  env-deploy-mode:
    description: 'deployment | job (generate-mode only)'
    required: false
    default: ''
  image-auto-update-provider:
    description: 'keel | keelson | none'
    required: false
    default: ''
  image-auto-update-policy:
    description: 'patch | minor | major | all | force (force is keel-only)'
    required: false
    default: ''
  image-auto-update-trigger:
    description: 'poll | default'
    required: false
    default: ''
  image-auto-update-poll-schedule:
    description: 'Single-unit duration, e.g. 1m (rendered per provider)'
    required: false
    default: ''
  image-auto-update-field-manager-strategy:
    description: 'mimic | patch | claim (keelson only, ignored otherwise)'
    required: false
    default: ''
  cluster-scoped-delegation:
    description: 'self | parent (env-only; RP is the root and always self)'
    required: false
    default: ''
  cluster-scoped-kinds-file:
    description: 'File NAME (versioned) of the cluster-scoped Kind list in fixed src/data/cluster-scoped-kinds/'
    required: false
    default: ''
  env-deploy-base-image-registry:
    description: 'Registry of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-include-namespace:
    description: 'true (default) includes the namespace segment in the composed base image; false ignores the namespace value and condenses the segment out'
    required: false
    default: ''
  env-deploy-base-image-namespace:
    description: 'Namespace segment of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-family:
    description: 'Family of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-version:
    description: 'Version of the composed environment deploy base image'
    required: false
    default: ''
  allow-local-manifests-override:
    description: 'When true, local src/kubernetes files override colliding child-contributed paths (warn per replacement)'
    required: false
    default: ''
  fail-on-unreferenced-config-or-secrets:
    description: 'When true (default), config/secret value files no token references fail the build; false warns'
    required: false
    default: ''
  secrets-sub-path:
    description: 'Directory containing encrypted secret value files (relative)'
    required: false
    default: ''

outputs:
  manifests-zip-file-name:
    description: 'Filename of the zip (computed from project-name and version)'
    value: ${{ steps.prepare.outputs.MANIFESTS_ZIP_FILE_NAME }}

runs:
  using: 'composite'
  steps:
    - name: Prepare deploy-manifests for packaging
      id: prepare
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        ALLOW_LOCAL_DEFAULTS_OVERRIDE: ${{ inputs.allow-local-defaults-override }}
        ALLOW_LOCAL_MANIFESTS_OVERRIDE: ${{ inputs.allow-local-manifests-override }}
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}
        VERSION_MAJOR: ${{ inputs.version-major }}
        VERSION_MINOR: ${{ inputs.version-minor }}
        VERSION_PATCH: ${{ inputs.version-patch }}
        VERSION_2_PART: ${{ inputs.version-2-part }}
        VERSION_3_PART: ${{ inputs.version-3-part }}
        VERSION_4_PART: ${{ inputs.version-4-part }}
        VERSION_DNS_SAFE: ${{ inputs.version-dns-safe }}
        VERSION_2_PART_DNS_SAFE: ${{ inputs.version-2-part-dns-safe }}
        VERSION_3_PART_DNS_SAFE: ${{ inputs.version-3-part-dns-safe }}
        VERSION_4_PART_DNS_SAFE: ${{ inputs.version-4-part-dns-safe }}
        GIT_TAG: ${{ inputs.git-tag }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        DOCKER_TAG: ${{ inputs.docker-tag }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        DOCKER_IMAGE_FULL_URI: ${{ inputs.docker-image-full-uri }}
        TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        IS_RELEASE: ${{ inputs.is-release }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
        TOKEN_NAME_VALIDATION: ${{ inputs.token-name-validation }}
        ALLOW_BUILTIN_TOKEN_OVERRIDE: ${{ inputs.allow-builtin-token-override }}
        CONFIG_VALUE_TRAILING_NEWLINE: ${{ inputs.config-value-trailing-newline }}
        TOKEN_SUBSTITUTION_PASSES: ${{ inputs.token-substitution-passes }}
        ENV_ENVIRONMENT_DEPLOY_SOURCE_BASE_PATH: ${{ inputs.env-deploy-source-base-path }}
      run: "${{ github.action_path }}/../../scripts/main/kubernetes-run-image-deploy-manifests-package-prepare"

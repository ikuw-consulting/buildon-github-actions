name: 'Kubernetes Run Image Deploy Manifests Repo Provider Package'
description: 'Packages the deploy-manifests set for the repo provider (builds the manifests docker image; does NOT publish) - the stock repo-provider-package pinned by its wrapper script'

inputs:
  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Docker push image list file path
  docker-push-image-list-file:
    description: 'Path to file listing image URIs for docker-push-all (set by docker-registry-logins)'
    required: true
  # Manifests source
  manifests-sub-path:
    description: 'Directory containing Kubernetes manifests (relative)'
    required: false
    default: 'src/kubernetes'
  # Manifests packaging
  manifests-repo-provider-type:
    description: 'Repo provider type for manifest storage (default: docker, currently the only supported provider)'
    required: false
    default: 'docker'
  manifests-packaging-base-image:
    description: 'Base image for manifest packaging (default: scratch)'
    required: false
    default: ''
  # Docker registry logins
  docker-registry-logins:
    description: 'YAML config for Docker registry logins (registry URL as key)'
    required: false
    default: ''
  # Docker target config
  docker-target-registry:
    description: 'Target container registry domain (defaults to ghcr.io on GH Actions)'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Path segment between registry and image name (defaults to lower cased org name or user ID on GH Actions)'
    required: false
    default: ''
  # Docker push targets
  docker-push-targets:
    description: 'JSON array of additional push targets [{registry, namespace?}]'
    required: false
    default: ''
  # Env/RP-scope run settings (spec.main.environment
  # projections plus the shared global paths the run steps consume).
  # Empty values fall through to the script defaults in
  # src/scripts/defaults/environments.bash.
  env-deploy-source-base-path:
    description: 'Source dir for the deploy-image manifests (relative)'
    required: false
    default: ''
  generate-ideal-environment-deploy-manifests:
    description: 'Generate the ideal deploy manifests (true) or consume supplied ones (false)'
    required: false
    default: ''
  image-deploy-manifests-apply-mode:
    description: 'How a run-platform applies this environment deploy-manifests set - seed-and-compare or enforce-state-normally, environment only'
    required: false
    default: ''
  env-deploy-mode:
    description: 'deployment | job (generate-mode only)'
    required: false
    default: ''
  image-auto-update-provider:
    description: 'keel | keelson | none'
    required: false
    default: ''
  image-auto-update-policy:
    description: 'patch | minor | major | all | force (force is keel-only)'
    required: false
    default: ''
  image-auto-update-trigger:
    description: 'poll | default'
    required: false
    default: ''
  image-auto-update-poll-schedule:
    description: 'Single-unit duration, e.g. 1m (rendered per provider)'
    required: false
    default: ''
  image-auto-update-field-manager-strategy:
    description: 'mimic | patch | claim (keelson only, ignored otherwise)'
    required: false
    default: ''
  cluster-scoped-delegation:
    description: 'self | parent (env-only; RP is the root and always self)'
    required: false
    default: ''
  cluster-scoped-kinds-file:
    description: 'File NAME (versioned) of the cluster-scoped Kind list in fixed src/data/cluster-scoped-kinds/'
    required: false
    default: ''
  env-deploy-base-image-registry:
    description: 'Registry of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-include-namespace:
    description: 'true (default) includes the namespace segment in the composed base image; false ignores the namespace value and condenses the segment out'
    required: false
    default: ''
  env-deploy-base-image-namespace:
    description: 'Namespace segment of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-family:
    description: 'Family of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-version:
    description: 'Version of the composed environment deploy base image'
    required: false
    default: ''
  allow-local-manifests-override:
    description: 'When true, local src/kubernetes files override colliding child-contributed paths (warn per replacement)'
    required: false
    default: ''
  fail-on-unreferenced-config-or-secrets:
    description: 'When true (default), config/secret value files no token references fail the build; false warns'
    required: false
    default: ''
  secrets-sub-path:
    description: 'Directory containing encrypted secret value files (relative)'
    required: false
    default: ''

  # Action-specific inputs
  manifests-zip-sub-path:
    description: 'Relative path to the directory containing the manifests zip'
    required: true
  manifests-zip-file-name:
    description: 'Filename of the manifests zip'
    required: true
  docker-image-name:
    description: 'Image name (from version generator)'
    required: false
    default: ''
  docker-tag:
    description: 'Tag for target image (includes prerelease suffix if applicable)'
    required: false
    default: ''
  project-name:
    description: 'Run name (run-* / run-platform-*)'
    required: true
  version:
    description: 'Version tag'
    required: true
  cluster-scoped-on-behalf-zip-file:
    description: 'Path to the delegated cluster-scoped zip from kubernetes-run-package. Set only when clusterScopedDelegation=parent carved a set out (env builds); empty means nothing to ship.'
    required: false
    default: ''
  contract-zip-sub-path:
    description: 'Directory containing the contract zip (required - consumers resolve a bundle through its contract)'
    required: true
  contract-zip-file-name:
    description: 'Filename of the contract zip (required)'
    required: true
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true

outputs:
  # --- Pass-through for publish step ---
  manifests-uri:
    description: 'Manifests location (for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_URI }}
  manifests-artifact-sub-path:
    description: 'Relative path to packaged artifact (for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_ARTIFACT_SUB_PATH }}
  manifests-zip-sub-path:
    description: 'Relative path to directory containing manifests zip (pass through for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_ZIP_SUB_PATH }}
  manifests-zip-file-name:
    description: 'Filename for manifests zip (pass through for publish step)'
    value: ${{ steps.package.outputs.MANIFESTS_ZIP_FILE_NAME }}
  version:
    description: 'Version/tag (pass through for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_VERSION }}
  repo-provider-url:
    description: 'Computed REPO_PROVIDER_URL (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_URL }}
  repo-provider-namespace:
    description: 'Computed REPO_PROVIDER_NAMESPACE (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_NAMESPACE }}
  repo-provider-name:
    description: 'Computed REPO_PROVIDER_NAME (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_NAME }}
  repo-provider-version:
    description: 'Computed REPO_PROVIDER_VERSION (for publish step)'
    value: ${{ steps.package.outputs.REPO_PROVIDER_VERSION }}

runs:
  using: 'composite'
  steps:
    - name: Package deploy-manifests for repo provider
      id: package
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        PROJECT_NAME: ${{ inputs.project-name }}
        VERSION: ${{ inputs.version }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        DOCKER_PUSH_IMAGE_LIST_FILE: ${{ inputs.docker-push-image-list-file }}
        MANIFESTS_REPO_PROVIDER_TYPE: ${{ inputs.manifests-repo-provider-type }}
        MANIFESTS_ZIP_SUB_PATH: ${{ inputs.manifests-zip-sub-path }}
        MANIFESTS_ZIP_FILE_NAME: ${{ inputs.manifests-zip-file-name }}
        CONTRACT_ZIP_SUB_PATH: ${{ inputs.contract-zip-sub-path }}
        CONTRACT_ZIP_FILE_NAME: ${{ inputs.contract-zip-file-name }}
        RUN_CLUSTER_SCOPED_ON_BEHALF_ZIP_FILE: ${{ inputs.cluster-scoped-on-behalf-zip-file }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        DOCKER_TAG: ${{ inputs.docker-tag }}
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        REPO_PROVIDER_AUTH_TOKEN: ${{ github.token }}
        REPO_PROVIDER_AUTH_USER: ${{ github.actor }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        ENV_ENVIRONMENT_DEPLOY_SOURCE_BASE_PATH: ${{ inputs.env-deploy-source-base-path }}
      run: "${{ github.action_path }}/../../scripts/main/kubernetes-run-image-deploy-manifests-repo-provider-package"

name: 'Release Change Data OCI Package'
description: 'Packages release change data as OCI image for consolidated push'

inputs:
  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Docker push image list file path
  docker-push-image-list-file:
    description: 'Path to file listing image URIs for docker-push-all (set by docker-registry-logins)'
    required: true

  # Action-specific inputs (passed from workflow/version generator)
  version:
    description: 'Release version (from version generator)'
    required: true
  docker-tag:
    description: 'Docker tag (from version generator)'
    required: true
  docker-image-name:
    description: 'Docker image name (from version generator)'
    required: true
  docker-target-registry:
    description: 'Target container registry (pre-resolved by workflow)'
    required: true
  docker-target-namespace:
    description: 'Namespace between registry and image name (pre-resolved by workflow)'
    required: false
    default: ''
  project-name:
    description: 'Project name (from version generator)'
    required: true
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true
  # Target platform for docker/podman operations
  docker-platform:
    description: 'Target platform (linux/amd64, linux/arm64, linux/386, or amd64 and arm64 comma-separated)'
    required: false
    default: 'linux/amd64'

outputs:
  release-change-data-image-uri:
    description: 'Full image URI of the release change data OCI package'
    value: ${{ steps.package.outputs.RELEASE_CHANGE_DATA_IMAGE_URI }}

runs:
  using: 'composite'
  steps:
    # The actions pass their state to each other through one job's workspace, so
    # each refuses to run unless the workflow running it lives in this repository.
    - name: Check workflow repository
      if: job.workflow_repository != github.action_repository && success()
      shell: bash
      env:
        WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        echo "::error::This action is part of the Kaptain BuildOn GitHub Actions repo or a fork thereof. It is not intended tbe used in a standalone fashion as part of any adhoc workflow elsewhere."
        echo "::error::This action is internal to ${ACTION_REPOSITORY} and only runs from that repository's own workflows. It was run by a workflow in ${WORKFLOW_REPOSITORY:-an unknown repository}."
        echo "::error::Documentation on how to use the upstream Kaptain buildon-github-actions workflows can be found here: https://github.com/kube-kaptain/buildon-github-actions/tree/main/examples"
        exit 1

    - name: Package release change data as OCI image
      id: package
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        VERSION: ${{ inputs.version }}
        DOCKER_TAG: ${{ inputs.docker-tag }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        PROJECT_NAME: ${{ inputs.project-name }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        DOCKER_PUSH_IMAGE_LIST_FILE: ${{ inputs.docker-push-image-list-file }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        DOCKER_PLATFORM: ${{ inputs.docker-platform }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/main/release-change-data-oci-package"

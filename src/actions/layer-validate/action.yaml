name: 'Layer Validate'
description: 'Validates substituted layer or layerset after docker build'

inputs:
  layer-type:
    description: 'Layer type: layer or layerset (from layer-package-prepare)'
    required: true
  image-build-command:
    description: 'Container runtime command (docker or podman)'
    required: true
  docker-platform:
    description: 'Target platform(s) for docker build'
    required: false
    default: 'linux/amd64'
  docker-target-registry:
    description: 'Target registry for dependency resolution'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Target namespace for dependency resolution'
    required: false
    default: ''

  # Token substitution
  token-delimiter-style:
    description: 'Token delimiter syntax for variables (shell, mustache, helm, erb, github-actions, blade, stringtemplate, ognl, t4, swift)'
    required: false
    default: 'shell'
  token-name-style:
    description: 'Case style for token names (UPPER_SNAKE, lower_snake, lower-kebab, UPPER-KEBAB, camelCase, PascalCase, lower.dot, UPPER.DOT)'
    required: false
    default: 'PascalCase'
  token-name-validation:
    description: 'How to validate user token names (MATCH = must match token-name-style, ALL = accept any valid name)'
    required: false
    default: 'MATCH'
  config-sub-path:
    description: 'Directory containing user-defined token files (relative)'
    required: false
    default: 'src/config'
  config-value-trailing-newline:
    description: 'How to handle trailing newlines in config values (strip-for-single-line, preserve-all, always-strip-one-newline)'
    required: false
    default: 'strip-for-single-line'
  token-substitution-passes:
    description: 'Number of times to run the token substitution pass (for nested token references)'
    required: false
    default: '1'
  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Schema validation provider
  schema-validation-command:
    description: 'Full path to the schema validation plugin (from validate-tooling)'
    required: true

runs:
  using: 'composite'
  steps:
    # The actions pass their state to each other through one job's workspace, so
    # each refuses to run unless the workflow running it lives in this repository.
    - name: Check workflow repository
      if: job.workflow_repository != github.action_repository && success()
      shell: bash
      env:
        WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        echo "::error::This action is part of the Kaptain BuildOn GitHub Actions repo or a fork thereof. It is not intended tbe used in a standalone fashion as part of any adhoc workflow elsewhere."
        echo "::error::This action is internal to ${ACTION_REPOSITORY} and only runs from that repository's own workflows. It was run by a workflow in ${WORKFLOW_REPOSITORY:-an unknown repository}."
        echo "::error::Documentation on how to use the upstream Kaptain buildon-github-actions workflows can be found here: https://github.com/kube-kaptain/buildon-github-actions/tree/main/examples"
        exit 1

    - name: Validate layer
      id: validate
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        LAYER_TYPE: ${{ inputs.layer-type }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        DOCKER_PLATFORM: ${{ inputs.docker-platform }}
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        SCHEMA_VALIDATION_COMMAND: ${{ inputs.schema-validation-command }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/main/layer-validate"

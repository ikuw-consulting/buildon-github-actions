#
# Kubernetes Run Platform Meta Environment
#
# Builds a deployable run platform (meta environment): a bone-stock
# deploy-manifests set for bootstrap, plus the bespoke platform aggregate
# with managed run-* children, deploy image, and run artifacts.
#
# All configuration is in KaptainPM.yaml - see docs for available fields.

name: Kubernetes Run Platform Meta Environment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    uses: kube-kaptain/buildon-github-actions/.github/workflows/kubernetes-run-platform-meta-environment.yaml@1.1.57
    permissions:
      contents: write
      packages: write
      checks: write
    # Override the default runner if needed:
    # with:
    #   runner: ubuntu-latest

apiVersion: kaptain.org/1.31
kind: basic-quality-and-versioning

spec:
  platform:
    githubActions:
      release:
        enabled: true
        substitutedFiles: dist/output.txt
        verbatimFiles: CHANGELOG.md,LICENSE
        notes: ''
        addVersionToFilenames: true
        # Which references the "How to Consume" section shows, and in what
        # order. Defaults to short-only, which suits private in-house work.
        # Open source projects want full-first; vendor packages consumed only
        # from other orgs want full-only.
        consumerReferenceForms: full-first
